<figure class="pfig l-body" id="figure-7">
  <div style="max-width: 720px; margin: 0 auto;">
    <svg viewBox="0 0 1200 920" role="img" aria-labelledby="f7title f7desc">
      <title id="f7title">Neuron-model families as extensions of a shared staged update</title>
      <desc id="f7desc">All models receive a common drive and update state before emitting an event. Six panels compare integrate-and-fire, leaky integrate-and-fire, current-based leaky integrate-and-fire, adaptive leaky integrate-and-fire, multicompartment models, and different emission semantics.</desc>
      <defs>
        <marker id="f7arr" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker>
        <marker id="f7arrred" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#D63A2F"/></marker>
      </defs>

      <text x="600" y="43" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">Neuron-model families share an update contract</text>
      <text x="600" y="72" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px" fill="#555">Models differ in the state they retain, the dynamics they apply, and the event they emit.</text>

      <g class="f7-help">
        <title>Every model begins with a common drive. It may be produced by weighted incoming events, an explicit input current, or both. The model-specific distinction begins with the state update.</title>
        <rect x="42" y="104" width="1116" height="142" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <text x="72" y="134" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Common staged update at time <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan></text>
        <rect x="72" y="158" width="214" height="56" rx="8" fill="#CFE2F3" stroke="#000" stroke-width="2.2"/>
        <text x="179" y="183" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">incoming events</text>
        <text x="179" y="204" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">and external drive</text>
        <line x1="286" y1="186" x2="334" y2="186" stroke="#000" stroke-width="2.4" marker-end="url(#f7arr)"/>
        <rect x="342" y="158" width="226" height="56" rx="8" fill="#CCFFCC" stroke="#000" stroke-width="2.2"/>
        <text x="455" y="183" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">state update</text>
        <text x="455" y="204" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">model-specific dynamics</text>
        <line x1="568" y1="186" x2="616" y2="186" stroke="#000" stroke-width="2.4" marker-end="url(#f7arr)"/>
        <rect x="624" y="158" width="226" height="56" rx="8" fill="#FFDDA6" stroke="#000" stroke-width="2.2"/>
        <text x="737" y="183" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">compare and emit</text>
        <text x="737" y="204" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">threshold and payload rule</text>
        <line x1="850" y1="186" x2="898" y2="186" stroke="#000" stroke-width="2.4" marker-end="url(#f7arr)"/>
        <rect x="906" y="158" width="216" height="56" rx="8" fill="#F9D4EA" stroke="#000" stroke-width="2.2"/>
        <text x="1014" y="183" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">reset or retain</text>
        <text x="1014" y="204" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">state for the next step</text>
        <rect class="f7-band" x="42" y="104" width="1116" height="142" rx="10" fill="#D63A2F" opacity="0"/>
        <rect x="42" y="104" width="1116" height="142" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <text x="42" y="284" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">What the model adds</text>
      <text x="1158" y="284" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">Illustrative discrete-time forms, not a universal notation</text>

      <g class="f7-help">
        <title>Integrate-and-fire retains one membrane state. Incoming drive accumulates with no passive decay. Thresholding and reset remain separate choices.</title>
        <rect x="42" y="310" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M42,350 V320 A10,10 0 0 1 52,310 H384 A10,10 0 0 1 394,320 V350 Z" fill="#CFE2F3"/>
        <line x1="42" y1="350" x2="394" y2="350" stroke="#000" stroke-width="2.2"/>
        <text x="64" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700" fill="#000">IF</text>
        <text x="120" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">integrate-and-fire</text>
        <text x="67" y="389" style="font-family:'Times New Roman',Times,serif;font-size:24px;font-style:italic" fill="#000">V[t+1] = V[t] + I[t]</text>
        <rect x="67" y="408" width="112" height="31" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.7"/><text x="123" y="430" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">state <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan></text>
        <rect x="188" y="408" width="170" height="31" rx="5" fill="#CCFFCC" stroke="#000" stroke-width="1.7"/><text x="273" y="430" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">accumulation only</text>
        <line x1="67" y1="517" x2="365" y2="517" stroke="#000" stroke-width="2.1" marker-end="url(#f7arr)"/>
        <path d="M82 507 H135 V487 H188 V467 H241 V447 H294 V427 H347" fill="none" stroke="#D63A2F" stroke-width="4.6"/>
        <text x="67" y="496" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">no passive decay</text>
        <rect class="f7-band" x="42" y="310" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="42" y="310" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <g class="f7-help">
        <title>Leaky integrate-and-fire keeps the same membrane state but attenuates it at each step. The factor lambda represents passive memory loss in a discrete-time model.</title>
        <rect x="424" y="310" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M424,350 V320 A10,10 0 0 1 434,310 H766 A10,10 0 0 1 776,320 V350 Z" fill="#CCFFCC"/><line x1="424" y1="350" x2="776" y2="350" stroke="#000" stroke-width="2.2"/>
        <text x="446" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700" fill="#000">LIF</text><text x="514" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">leaky integrate-and-fire</text>
        <text x="449" y="389" style="font-family:'Times New Roman',Times,serif;font-size:24px;font-style:italic" fill="#000">V[t+1] = &#955;V[t] + I[t]</text>
        <rect x="449" y="408" width="112" height="31" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.7"/><text x="505" y="430" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">state <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan></text>
        <rect x="570" y="408" width="168" height="31" rx="5" fill="#CCFFCC" stroke="#000" stroke-width="1.7"/><text x="654" y="430" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">leak, 0 &lt; &#955; &lt; 1</text>
        <line x1="449" y1="517" x2="747" y2="517" stroke="#000" stroke-width="2.1" marker-end="url(#f7arr)"/>
        <path d="M464 447 C501 455 527 470 555 482 C585 495 613 501 642 505 C674 509 704 511 729 512" fill="none" stroke="#D63A2F" stroke-width="4.6"/><text x="449" y="496" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">state relaxes between inputs</text>
        <rect class="f7-band" x="424" y="310" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="424" y="310" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <g class="f7-help">
        <title>Current-based LIF adds an explicit synaptic-current state. Events first update current, then current drives the membrane state. This separates synaptic filtering from membrane leakage.</title>
        <rect x="806" y="310" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M806,350 V320 A10,10 0 0 1 816,310 H1148 A10,10 0 0 1 1158,320 V350 Z" fill="#FFDDA6"/><line x1="806" y1="350" x2="1158" y2="350" stroke="#000" stroke-width="2.2"/>
        <text x="828" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700" fill="#000">CUBA-LIF</text>
        <text x="828" y="386" style="font-family:'Times New Roman',Times,serif;font-size:21px;font-style:italic" fill="#000">I[t+1] = &#945;I[t] + Ws[t]</text>
        <text x="828" y="415" style="font-family:'Times New Roman',Times,serif;font-size:21px;font-style:italic" fill="#000">V[t+1] = &#955;V[t] + I[t+1]</text>
        <rect x="828" y="430" width="113" height="31" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.7"/><text x="884" y="452" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">states <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">I, V</tspan></text>
        <rect x="951" y="430" width="181" height="31" rx="5" fill="#CCFFCC" stroke="#000" stroke-width="1.7"/><text x="1041" y="452" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">synaptic filtering</text>
        <rect x="828" y="500" width="105" height="27" rx="5" fill="#CDEBCD" stroke="#000" stroke-width="1.8"/><text x="880" y="520" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">events</text><line x1="933" y1="514" x2="969" y2="514" stroke="#000" stroke-width="2" marker-end="url(#f7arr)"/><rect x="978" y="500" width="68" height="27" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.8"/><text x="1012" y="520" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:18px;font-style:italic" fill="#000">I</text><line x1="1046" y1="514" x2="1075" y2="514" stroke="#000" stroke-width="2" marker-end="url(#f7arr)"/><rect x="1084" y="500" width="50" height="27" rx="5" fill="#FFDDA6" stroke="#000" stroke-width="1.8"/><text x="1109" y="520" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:18px;font-style:italic" fill="#000">V</text>
        <rect class="f7-band" x="806" y="310" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="806" y="310" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <g class="f7-help">
        <title>Adaptive LIF adds a slowly evolving adaptation state. The threshold or drive then depends on recent output activity, so repeated firing changes the next decision.</title>
        <rect x="42" y="590" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M42,630 V600 A10,10 0 0 1 52,590 H384 A10,10 0 0 1 394,600 V630 Z" fill="#F9D4EA"/><line x1="42" y1="630" x2="394" y2="630" stroke="#000" stroke-width="2.2"/>
        <text x="64" y="618" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700" fill="#000">ALIF</text><text x="134" y="618" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">adaptive leaky integrate-and-fire</text>
        <text x="67" y="669" style="font-family:'Times New Roman',Times,serif;font-size:22px;font-style:italic" fill="#000">a[t+1] = &#961;a[t] + s[t]</text>
        <text x="67" y="699" style="font-family:'Times New Roman',Times,serif;font-size:22px;font-style:italic" fill="#000">&#952;[t] = &#952;<tspan dy="6" style="font-size:14px">0</tspan><tspan dy="-6"> + &#946;a[t]</tspan></text>
        <rect x="67" y="714" width="116" height="31" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.7"/><text x="125" y="736" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">states <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V, a</tspan></text>
        <rect x="192" y="714" width="174" height="31" rx="5" fill="#CCFFCC" stroke="#000" stroke-width="1.7"/><text x="279" y="736" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">adaptive threshold</text>
        <path d="M82 811 H124 V785 H166 V811 H208 V779 H250 V811 H292 V774 H334 V811" fill="none" stroke="#D63A2F" stroke-width="3.5"/><path d="M89 799 C140 779 191 764 240 752 C278 744 313 742 356 742" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="6 5"/><text x="67" y="822" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">recent spikes raise the threshold</text>
        <rect class="f7-band" x="42" y="590" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="42" y="590" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <g class="f7-help">
        <title>Multicompartment models retain more than one coupled state, for example dendritic and somatic potentials. They can represent where a drive arrives and how it is transformed before emission.</title>
        <rect x="424" y="590" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M424,630 V600 A10,10 0 0 1 434,590 H766 A10,10 0 0 1 776,600 V630 Z" fill="#CDEBCD"/><line x1="424" y1="630" x2="776" y2="630" stroke="#000" stroke-width="2.2"/>
        <text x="446" y="618" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700" fill="#000">Multicompartment</text>
        <rect x="458" y="662" width="99" height="68" rx="8" fill="#CFE2F3" stroke="#000" stroke-width="2.2"/><text x="507" y="691" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">dendrite</text><text x="507" y="715" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:20px;font-style:italic" fill="#000">V<tspan dy="6" style="font-size:13px">d</tspan></text>
        <line x1="557" y1="696" x2="611" y2="696" stroke="#000" stroke-width="2.4" marker-end="url(#f7arr)"/><rect x="619" y="662" width="99" height="68" rx="8" fill="#FFDDA6" stroke="#000" stroke-width="2.2"/><text x="668" y="691" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">soma</text><text x="668" y="715" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:20px;font-style:italic" fill="#000">V<tspan dy="6" style="font-size:13px">s</tspan></text>
        <rect x="449" y="748" width="133" height="31" rx="5" fill="#CFE2F3" stroke="#000" stroke-width="1.7"/><text x="515" y="770" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">states <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan><tspan dy="5" style="font-size:12px">d</tspan><tspan dy="-5">, V</tspan><tspan dy="5" style="font-size:12px">s</tspan></text>
        <rect x="591" y="748" width="158" height="31" rx="5" fill="#CCFFCC" stroke="#000" stroke-width="1.7"/><text x="670" y="770" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">coupled spatial states</text>
        <text x="449" y="810" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Number and coupling of compartments are model choices.</text>
        <rect class="f7-band" x="424" y="590" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="424" y="590" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <g class="f7-help">
        <title>Emission semantics need not be a binary spike. A model may emit signed events or carry a graded payload. This changes the communicated value, not necessarily the membrane dynamics above it.</title>
        <rect x="806" y="590" width="352" height="246" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <path d="M806,630 V600 A10,10 0 0 1 816,590 H1148 A10,10 0 0 1 1158,600 V630 Z" fill="#FFFF66"/><line x1="806" y1="630" x2="1158" y2="630" stroke="#000" stroke-width="2.2"/>
        <text x="828" y="618" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700" fill="#000">Emission semantics</text>
        <text x="828" y="662" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">Shared state dynamics, different output values</text>
        <rect x="828" y="681" width="92" height="51" rx="7" fill="#F9D4EA" stroke="#000" stroke-width="2"/><text x="874" y="703" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700" fill="#000">binary</text><text x="874" y="724" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:19px;font-style:italic" fill="#000">{0, 1}</text>
        <rect x="937" y="681" width="92" height="51" rx="7" fill="#CFE2F3" stroke="#000" stroke-width="2"/><text x="983" y="703" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700" fill="#000">signed</text><text x="983" y="724" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:19px;font-style:italic" fill="#000">{&#8722;1, 0, +1}</text>
        <rect x="1046" y="681" width="88" height="51" rx="7" fill="#CDEBCD" stroke="#000" stroke-width="2"/><text x="1090" y="703" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700" fill="#000">graded</text><text x="1090" y="724" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:19px;font-style:italic" fill="#000">p &#8712; &#8484;</text>
        <text x="828" y="770" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">Deployment implication</text><text x="828" y="798" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">routing, arithmetic, and support can change.</text>
        <text x="828" y="821" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Do not infer a binary event format from the word “spike.”</text>
        <rect class="f7-band" x="806" y="590" width="352" height="246" rx="10" fill="#D63A2F" opacity="0"/><rect x="806" y="590" width="352" height="246" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <text x="600" y="886" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">A deployable SNN description therefore records its state variables, update rule, threshold and reset, and emitted payload.</text>
    </svg>
  </div>
  <div class="fig-hint">Hover a model family for the state and semantic distinction it adds.</div>
  <figcaption><b>Figure 7:</b> Neuron models can be compared as extensions of a common staged update. IF retains only accumulation, LIF adds leak, CUBA-LIF adds synaptic-current dynamics, ALIF adds activity-dependent adaptation, and multicompartment models add coupled state variables. The emitted event may also be binary, signed, or graded, which is a separate semantic choice with consequences for deployment.</figcaption>
</figure>
