<figure class="pfig l-body" id="figure-11">
  <div style="max-width: 720px; margin: 0 auto;">
    <!--
      Derived mini-traces. IF panel: u[t] = u[t-1] + q with q = 0.2 for six steps, no threshold drawn.
      LIF panel: u[t] = 0.8 u[t-1] with q = 0 from u = 1 for eight steps.
      ALIF panel: pre-reset u[t] = u[t-1] + q, q = 0.32; theta[t] = 1.0 + 0.6 a[t-1]; a[t] = 0.7 a[t-1] + z[t];
        z[t] = 1 if u[t] >= theta[t]; reset by subtraction u[t] <- u[t] - z[t] theta[t]; sixteen steps from u = a = 0.
        Pre-reset u: [0.32, 0.64, 0.96, 1.28, 0.6, 0.92, 1.24, 1.56, 0.67, 0.99, 1.31, 1.63, 0.7, 1.02, 1.34, 1.66]

        z:           [0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0, 1, 0, 0, 0, 1]
    -->
    <svg viewBox="0 0 1200 920" role="img" aria-labelledby="f11title f11desc">
      <title id="f11title">Neuron-model families as instances of one staged update</title>
      <desc id="f11desc">A top band shows the four stages of the common update, synaptic, membrane, threshold, and reset. Six panels then state which stage each family changes. Integrate-and-fire changes nothing. Leaky integrate-and-fire adds a leak factor in the membrane stage. Current-based LIF turns the synaptic stage into a leaky filter. Adaptive LIF couples the threshold to an adaptation state updated beside the reset stage. Multicompartment models run the synaptic and membrane stages once per compartment with only the soma thresholding and resetting. A final panel shows binary, signed, and graded emission as a payload choice rather than a sixth family. Conceptual illustration with derived mini-traces.</desc>
      <defs>
        <marker id="f11arr" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker>
      </defs>

      <text x="600" y="43" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">Which stage does each neuron model change?</text>
      <text x="600" y="72" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px" fill="#555">Every family is the common staged update with one named stage altered. Emission semantics change the payload, not the dynamics.</text>

      <g class="f11-help">
        <title>Adaptive LIF leaves the synaptic and membrane stages as in IF or LIF and makes the threshold a function of an adaptation state that is raised by each emitted event and relaxes between events. The adaptation update runs beside the reset stage.</title>

  <figcaption><b>Figure 11:</b> Conceptual illustration of the neuron-model family as instances of the staged update \(\mathcal{S}^l\), \(\mathcal{M}^l\), \(\mathcal{H}\), \(\mathcal{R}^l\) of Section 3.2, with layer and unit indices dropped in the panels. Integrate-and-fire changes nothing. Leaky integrate-and-fire changes only the membrane stage by the leak factor \(\alpha\). Current-based LIF changes the synaptic stage, which becomes a leaky filter with factor \(\beta\) and adds the persistent state \(q[t]\). Adaptive LIF changes the threshold, which becomes \(\theta_0+\kappa a[t-1]\) with the adaptation state \(a[t]\) updated beside the reset stage. A multicompartment neuron runs the synaptic and membrane stages once per compartment, and only the somatic compartment thresholds and resets. The sixth panel is emission semantics, a binary event, a signed payload, or a graded payload, which changes what the threshold stage emits and what the next synaptic stage consumes rather than which dynamical variant runs underneath. The mini-traces in the IF, LIF, and ALIF panels are computed from the stated equations with the parameters printed beside them; the common-drive comparison of the full traces is Figure 4.</figcaption>
