<!-- Conceptual figure; no measured quantity is drawn. Layout after PseudoSNN's Figure 1 (record pseudosnn-2026-heterolatency, page 28555, Figure 1 caption, a uniform-latency SNN uses a fixed global timestep T for all layers, a hetero-latency SNN employs learnable, layer-specific timesteps T_l), whose two panels, three-layer stack, spike streams in the gaps, one T node with a fan of arrows on the left, and four per-gap nodes on the right this figure keeps; no phrase of that caption is drawn and its drawing is not reproduced. Panel titles (Uniform latency, one global T; Heterogeneous latency, per-layer T_l) and the layer labels (spiking layer l, convolutional layer, spiking layer l + 1) are the first paragraph of Section 8.3.4 Mixed and Heterogeneous Timesteps in site/sec-08.html (a uniform-latency SNN gives every layer the same simulation horizon T and a hetero-latency SNN gives layer l its own T_l) and its Figure 30 lead paragraph (a three-layer stack of spiking, convolutional, and spiking layers connected by spike streams). The left gloss (one horizon, set once and shared by every layer) is the 8.3 lead and 8.3.4 (one global T shared by every layer) with PseudoSNN's introduction, page 28555 (T treated as a manually selected global hyperparameter). The right gloss (a horizon per layer, set or learned; under T_l = 2^b_l - 1 each is an activation bit-width b_l) is 8.3.4's second paragraph (a per-layer horizon is a per-layer activation bit-width, T_l = 2^b_l - 1) and PseudoSNN's related-work sorting of a static heterogeneous latency designed or learned per layer, page 28556. The node labels T_(l-1), T_l, T_l, T_(l+1) bottom to top, the convolutional layer carrying its input horizon through unchanged, and the horizon changing only at a spiking layer are the Figure 30 lead paragraph of 8.3.4. The stream label (spikes over the horizon) is Section 4's horizon vocabulary as the 8.3.4 lead uses it. The boundary label (the horizon changes here, average-and-broadcast or count-and-regenerate) is 8.3.4's boundary paragraph, whose first mechanism is PseudoSNN page 28558, Temporal Reshaping for Heterogeneous Latency and Eq. 13 (when T_l differs from T_(l-1) the layer's input is the temporal average of the previous layer's output broadcast across T_l steps) and whose second is the count-then-regenerate alternative that keeps the interface binary. Spikes are drawn as the upward strokes Figures 11 and 18 use, here as small arrows alternating an ink one and a light one; the amber of the horizon nodes and their arrows is Figure 29's encoding lever, the spiking-layer blue is Figure 29's neuron lever with the light fill and stroke Figure 23 gives it, the convolutional layer is Figure 29's neutral parameter-mapping gray; box style, arrow marker, text sizes, and the hover pattern are Figure 29's. No paper name, chip name, or number other than the symbols is drawn. -->
<svg viewBox="0 0 1200 492" role="img" aria-labelledby="f30-title f30-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f30-title">Uniform latency against heterogeneous latency in a converted network, two panels after PseudoSNN's Figure 1, each a stack of a spiking layer, a convolutional layer, and a second spiking layer joined by spike streams, with one global horizon T fanned from a single node to every layer on the left and a per-layer horizon held by a node beside each layer gap on the right</title>
  <desc id="f30-desc">Two panels side by side. Left panel, Uniform latency, one global T. A vertical stack of three wide rounded boxes read bottom to top, spiking layer l in light blue, convolutional layer in gray, spiking layer l plus 1 in light blue. In the four gaps, below the bottom box, between the boxes, and above the top box, a row of eight small upward arrows alternating dark and light stands for spikes flowing through the stack over the horizon, labeled once, spikes over the horizon. To the right of the stack one amber disc labeled T sends four amber arrows, one to each gap. Under the panel a line reads, one horizon, set once and shared by every layer. Right panel, Heterogeneous latency, per-layer T with subscript l. The same stack and the same spike streams, but no single node. Beside each gap sits its own amber disc, labeled from bottom to top T with subscript l minus 1, T with subscript l, T with subscript l, and T with subscript l plus 1, each joined to its stream by a pair of short amber arrows, one toward the stream and one back, for a horizon that is set or learned. The two discs around the convolutional layer carry the same label because that layer carries its input horizon through unchanged. On the left edge of the top spiking layer a small amber ring marks where the horizon changes, with the label, the horizon changes here, average-and-broadcast or count-and-regenerate. Under the panel two lines read, a horizon per layer, set or learned; under T with subscript l equals two to the power b with subscript l, minus one, each is an activation bit-width b with subscript l. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 30:</b> Uniform and heterogeneous latency in a converted network, each panel a stack of a spiking layer, a convolutional layer, and a second spiking layer joined by spike streams; on the left a single node holds one global horizon <i>T</i> and a fan of arrows imposes it on every layer, while on the right a node beside each layer gap holds that gap's own horizon, the convolutional layer carries its input horizon through unchanged so the two gaps around it share <i>T</i><sub><i>l</i></sub>, and the horizon changes only at a spiking layer. Where it changes, either a real-valued average of the previous layer's output over its own horizon is broadcast across the next horizon or its spike count is regenerated as a spike train over the next horizon. Under <i>T</i><sub><i>l</i></sub> = 2<sup><i>b</i><sub><i>l</i></sub></sup> &#8722; 1 each per-layer horizon is an activation bit-width <i>b</i><sub><i>l</i></sub>, so the right panel is an activation mixed-precision network read in time, and a mean of the <i>T</i><sub><i>l</i></sub> is a statistic of the allocation, not a latency (Section 4.1). Layout after PseudoSNN's Figure 1. Conceptual figure; no measured quantity is drawn.</figcaption>
