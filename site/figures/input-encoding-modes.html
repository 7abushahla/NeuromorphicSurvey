  <figcaption><b>Figure 16:</b> Conceptual illustration of what actually enters the first SNN layer under five input conventions applied to one scalar input \(x\). Poisson rate encoding draws a random binary spike at each step with probability set by \(x\), so the count over a window follows \(x\) only in expectation. Deterministic rate or count encoding schedules a fixed number of binary spikes in the window without sampling variance, under a stated timing rule. Repeated-frame or constant-value presentation hands the same value to the first layer at every step and is not a spike raster unless a separate encoder makes one. Direct constant-current input applies a real-valued drive \(I_{\mathrm{ext}}[t]=x\) to the first spiking layer, so there is no input spike train at that boundary, and it is an input convention rather than a spike code. Event-native sensing produces timestamped, address-bearing packets at acquisition, with a payload that depends on the sensor. Stochastic sampling is especially damaging at short horizons because a count built from only a few random draws can sit far from its expectation, whereas the deterministic schedule delivers the same count every time; a quantitative rate for this effect needs a stated source and assumptions and is not drawn. These five are not synonyms, and the input rule should be stated before accuracy, latency, activity, or deployment cost is compared.</figcaption>
