    <!--
      Derived traces. Continuous-time leaky integrate-and-fire example with an exponential synaptic current,
      integrated by forward Euler at dt = 0.01 in dimensionless model time tau on [0, 100].
        dI_syn/dtau = -I_syn/tau_s + w_1 sum_k delta(tau - tau_1k) + w_2 sum_k delta(tau - tau_2k)
        tau_m dV/dtau = -(V - E_L) + R_m I_syn,   E_L = 0, R_m = 1
        emit s(tau) when V >= theta; then V <- V_reset = 0 and V is held at 0 for tau_ref (absolute refractory interval)
      Parameters: tau_m = 15.0, tau_s = 4.0, theta = 1.0, tau_ref = 6.0, w_1 = 3.0, w_2 = 1.6.
      Input 1 spike times: [8, 40, 46, 76]. Input 2 spike times: [20, 50, 84].
      Result: one output spike at tau = 48.68; refractory until tau = 54.68; the later peak reaches V = 0.70 < theta.
      Mapping: x = 210 + 8.9 tau; I_syn row y = 286 - 64 I/I_max with I_max = 3.671; V row y = 460 - 78 V.
    -->

  <figcaption><b>Figure 6:</b> One leaky integrate-and-fire neuron followed through time, with every trace derived from the stated equations rather than sketched. Two presynaptic spike trains enter through weights \(w_1\) and \(w_2\). Each arriving spike adds its weight to the synaptic current \(I_{\mathrm{syn}}(\tau)\), which decays with \(\tau_s\). The membrane potential integrates that current and leaks toward rest with \(\tau_m\), so an incoming spike changes synaptic and membrane state but does not by itself produce an output. An output spike is emitted only when \(V(\tau)\) reaches the threshold \(\theta\), after which the reset rule sets \(V\) to zero and, in this example, holds it there for an optional refractory interval \(\tau_{\mathrm{ref}}\) during which the input arriving at that time still changes the current but not the potential. The later input cluster raises the potential to about \(0.7\,\theta\) and produces nothing. Conceptual illustration computed with \(\tau_m=15\), \(\tau_s=4\), \(\theta=1\), \(\tau_{\mathrm{ref}}=6\), \(w_1=3.0\), \(w_2=1.6\), and \(E_L=V_{\mathrm{reset}}=0\) in dimensionless time; this is one LIF example, not the dynamics of every SNN neuron, and refractory behavior is a model choice rather than a property shared by all of them.</figcaption>
