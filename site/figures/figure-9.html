  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1200 850" role="img" aria-labelledby="f9title f9desc">
    <title id="f9title">The RC origin of integrate-and-fire and leaky integrate-and-fire neurons</title>
    <desc id="f9desc">A parallel resistor-capacitor circuit receives synaptic and external current. Its capacitor voltage is the membrane potential and its resistor supplies the leak in the leaky integrate-and-fire model. Removing the leak gives the integrate-and-fire limit. Threshold and reset are shown separately because they are not properties of the passive RC circuit.</desc>

      <marker id="f9arrred" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#D63A2F"/></marker>
    </defs>

    <text x="48" y="45" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">Why SNNs speak in current, voltage, leak, and threshold</text>
    <text x="48" y="75" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">The LIF state equation inherits its vocabulary from a conceptual parallel RC circuit.</text>

    <g class="f9-hot">
      <title>The LIF equation says that current raises or lowers the state, while the leak pulls the state toward its resting potential. Its time constant is resistance times capacitance.</title>
      <rect x="580" y="110" width="578" height="432" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <path d="M580,150 V120 A10,10 0 0 1 590,110 H1148 A10,10 0 0 1 1158,120 V150 Z" fill="#FFDDA6"/><line x1="580" y1="150" x2="1158" y2="150" stroke="#000" stroke-width="2.2"/><text x="869" y="136" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:25px;font-weight:700" fill="#000">State equation and its terms</text>
      <rect x="615" y="184" width="508" height="86" rx="8" fill="#FFFF66" stroke="#000" stroke-width="2.2"/>
      <text x="869" y="236" text-anchor="middle" style="font-family:'Times New Roman',Times,serif;font-size:30px;font-style:italic" fill="#000">C<tspan dy="7" style="font-size:19px">m</tspan><tspan dy="-7"> dV/dτ = −g</tspan><tspan dy="7" style="font-size:19px">L</tspan><tspan dy="-7">(V−E</tspan><tspan dy="7" style="font-size:19px">L</tspan><tspan dy="-7">) + I</tspan><tspan dy="7" style="font-size:19px">syn</tspan><tspan dy="-7"> + I</tspan><tspan dy="7" style="font-size:19px">ext</tspan></text>
      <text x="630" y="310" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700" fill="#000">Capacitance</text><text x="630" y="338" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">C</tspan><tspan dy="5" style="font-size:13px">m</tspan><tspan dy="-5" style="font-family:Arial,Helvetica,sans-serif"> scales how much current changes </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan>.</text>
      <text x="630" y="386" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700" fill="#000">Leak conductance</text><text x="630" y="414" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">g</tspan><tspan dy="5" style="font-size:13px">L</tspan><tspan dy="-5" style="font-family:Arial,Helvetica,sans-serif"> pulls </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan><tspan style="font-family:Arial,Helvetica,sans-serif"> toward </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">E</tspan><tspan dy="5" style="font-size:13px">L</tspan><tspan dy="-5"/>.</text>
      <text x="630" y="462" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:700" fill="#000">Inputs</text><text x="630" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">I</tspan><tspan dy="5" style="font-size:13px">syn</tspan><tspan dy="-5" style="font-family:Arial,Helvetica,sans-serif"> from synapses. </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">I</tspan><tspan dy="5" style="font-size:13px">ext</tspan><tspan dy="-5" style="font-family:Arial,Helvetica,sans-serif"> is an external drive.</tspan></text>

      <title>Threshold and reset create spike emission. They are added to the passive state evolution and must be stated separately because reset semantics vary across SNN models and hardware targets.</title>

    <g class="f9-hot">
      <title>The same equations can describe different realizations. Software may use dimensionless or fixed-point state. Digital hardware uses registers and accumulators. Analog hardware can realize physical currents, charge, and voltages.</title>

  <div class="fig-hint">Hover a panel for the assumption carried by its circuit or equation.</div>
  <figcaption><b>Figure 9:</b> The leaky integrate-and-fire neuron derives its state vocabulary from an ideal parallel RC circuit. Synaptic and external currents change the capacitor voltage, while the leak conductance returns it toward a resting potential. The IF model is the zero-leak limit. Thresholding and reset are separate spike-generation semantics, and the same model can be represented by software recurrences, digital state updates, or physical analog variables.</figcaption>
