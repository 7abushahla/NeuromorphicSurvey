<figure class="pfig l-body" id="figure-27">
<!-- Conceptual figure; no measured quantity is drawn. Provenance of every drawn phrase and symbol. Section 8.2 opening paragraph of site/sec-08.html (eq:rate-quantizer): a soft-reset IF neuron's firing rate over a horizon of T steps can only take the T + 1 values 0, 1/T, 2/T, ..., 1, so its input-output map is a uniform quantizer with three cases, zero for a non-positive input, the input scaled by T and rounded to the nearest integer in between, and one at or above the clipping point; the middle case is discretization error, which the literature also calls quantization error, and the last case is clipping error, both fixed properties of the quantizer itself; every other term (residual and reset error, unevenness and timing error, encoding and readout error) exists because a real, finite spike train is not the ideal time average this quantizer describes. Its source is PseudoSNN's paragraph Rate-Coding as a Quantization Process, page 28558, Eq. 7 (record pseudosnn-2026-heterolatency). Section 8.1.2 (relu-rate-correspondence, eq:if-recurrence, eq:telescoped, eq:rate-identity): the IF recurrence with reset-by-subtraction, the count N(T), the firing fraction rho(T) = N(T)/T, the residual (u[T] - u[0])/(T theta). Section 8.1.3: the input injected as a constant per-pixel current for the whole horizon (Panel B's constant current q[t] = a at every step). Section 8.1.4: the calibration constant lambda, the decoded value a-hat = lambda rho(T), the threshold set to it, theta = lambda, and the decoded value confined to [0, lambda] (the clipping point). Section 8.2.1 (finite-time-error-model, eq:error-decomposition) and the 8.2.3, 8.2.4, 8.2.6 headings: residual and reset, unevenness and timing, encoding and readout. Section 8.3.1: the staircase is the object activation shaping trains the ANN onto; the neuron floors accumulated charge while ordinary quantization rounds, so the marked input a is chosen at a point where floor and round agree. Section 3.2 and 3.3 (eq:if, eq:membrane-threshold-stage, eq:reset-stage): membrane potential u[t], threshold theta, step t, spike z[t], current q[t]. Section 3.5 (eq:reset-by-subtraction): reset-by-subtraction removes only the threshold that was just crossed and carries the remainder forward; the label drops by theta, not to zero. Section 4.2 and 4.3: the spike count N(T) over T steps, the firing fraction rho(T) = N(T)/T, the encoder as a deterministic integration of a constant input current, T + 1 achievable levels spaced 1/T apart. Drawing conventions: membrane trace, threshold dashed line, reset drop and spike raster from Figures 11 and 14; box style, header band, arrow marker and text sizes from Figures 26 and 28; the red accent from Figure 28 for a finite-time error term, used only on the two shaded error regions; the hover pattern from Figure 29. Example drawn in Panel B and Panel C, never written as a number: T = 8 slots, a = 3 lambda / 8, theta = lambda, empty membrane at the start; pre-reset values 0.375, 0.75, 1.125, 0.5, 0.875, 1.25, 0.625, 1.0 (in units of theta), spikes at steps 3, 6, 8 with a drop of exactly theta after each, residuals 0.125, 0.25, 0 theta, so u[T] = u[0] = 0 and the residual term of eq:rate-identity vanishes in the drawn example, N(T) = 3, rho(T) = 3/8, and a lands on that level under floor and under round alike. -->
<svg viewBox="0 0 1200 404" role="img" aria-labelledby="f27-title f27-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f27-title">Rate coding as a uniform quantizer, from the continuous ReLU activation through a soft-reset integrate-and-fire neuron over T steps to the staircase of T plus one levels the firing fraction can take, with the discretization and clipping error the staircase fixes and the error terms it leaves out</title>
  <desc id="f27-desc">Four panels read left to right and joined by arrows. ANN activation, axes of input against output with the continuous ReLU line, zero for a negative input and rising with slope one, drawn lighter above the clipping point lambda, with one input a marked on the horizontal axis and its output on the line. Rate code over T steps, a constant current equal to a drives a soft-reset integrate-and-fire neuron with threshold theta equal to lambda; the membrane potential ramps, crosses the threshold, drops by theta rather than to zero, and ramps again; a raster of eight slots below it shows the spikes where the trace crossed, three of them, and the text reads N of T spikes in T steps, firing fraction rho of T equals N of T over T. The rate is a uniform quantizer, the same axes with the ReLU line drawn light and over it a blue staircase of T plus one levels from zero to lambda with equal treads and step edges at the half-way points, flat at lambda beyond the clipping point; three brackets along the horizontal axis read zero, rounded to the grid, and clipped; the gap between the staircase and the ReLU inside the middle region is shaded red and labeled quantization error, and the gap beyond the clipping point is shaded red and labeled clipping error; the same input a lands on the tread lambda times rho of T. What the ideal average leaves out, a quieter box to the far right naming residual and reset, unevenness and timing, and encoding and readout, with the gloss that a real spike train over a finite horizon is not this ideal average. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 27:</b> Rate coding read as a uniform quantizer, left to right, beginning from the trained network's continuous ReLU activation with the per-layer scale λ that parameter mapping fixes (Section 8.1.4) and one input <i>a</i> marked on it. The second panel drives a soft-reset integrate-and-fire neuron with that input as a constant current over <i>T</i> steps, in the vocabulary of Section 3, so the membrane potential ramps, crosses the threshold θ = λ, drops by θ rather than to zero, and ramps again, <i>N</i>(<i>T</i>) spikes fall in the <i>T</i> raster slots, and the firing fraction ρ(<i>T</i>) = <i>N</i>(<i>T</i>)/<i>T</i> of Section 4.2 is the rate. The third plots that rate against the same input axis, a staircase of <i>T</i> + 1 levels over the ReLU line with the three cases of the map, zero for a non-positive input, rounded to the nearest level in between, and clipped at the scale, on which <i>a</i> lands on the tread λρ(<i>T</i>). The two shaded gaps are the error sources the quantizer itself fixes, quantization error inside the grid and clipping error beyond it, the discretization and clipping error of Section 8.2.2; the fourth panel names what the ideal time average leaves out, residual and reset, unevenness and timing, and encoding and readout error, which Section 8.2.1 onward derives because a real spike train over a finite horizon is not that average. The staircase is the same object Section 8.1.2 derives from the telescoped integrate-and-fire recurrence and the one Section 8.3.1's activation shaping trains the ANN onto before conversion. Conceptual figure; no measured quantity is drawn.</figcaption>
