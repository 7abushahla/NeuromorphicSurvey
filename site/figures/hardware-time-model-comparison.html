      <title id="f11title">Why one timestep is not one universal unit of execution</title>
      <desc id="f11desc">Conceptual illustration with no measured platform quantity. Clocked cores advance one shared algorithmic index, drawn here with barriers, although a timer tick is a different mechanism with the same index semantics. Asynchronous hardware progresses on event arrival without a global timestep, and asynchrony does not give each layer its own horizon. Analog circuits evolve continuously in physical time and are sampled by digital control logic.</desc>
      <defs><marker id="f11arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>
      <text x="600" y="42" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700" fill="#000">One algorithmic step does not have one hardware meaning</text>
      <text x="600" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">The execution model determines whether a software horizon maps to barriers, event arrivals, or sampled continuous dynamics.</text>

        <g stroke="#000" stroke-width="2"><line x1="92" y1="237" x2="340" y2="237"/><line x1="92" y1="298" x2="340" y2="298"/><line x1="92" y1="359" x2="340" y2="359"/></g>

        <text x="183" y="416" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700" fill="#D63A2F">barrier</text><text x="348" y="416" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700" fill="#D63A2F">barrier</text>
        <rect x="65" y="458" width="296" height="126" rx="8" fill="#FFFF66" stroke="#000" stroke-width="1.8"/><text x="84" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What T means</text><text x="84" y="518" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">A count of synchronized updates.</text><text x="84" y="544" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">Barrier and timer tick differ.</text><text x="84" y="570" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">Step duration is not fixed by T.</text><rect class="f11-band" x="38" y="105" width="350" height="530" rx="10" fill="#D63A2F" opacity="0"/>

      <g class="f11-hot"><title>In a genuinely event-driven substrate each computation is triggered by an arriving event. There is no shared chip timestep, and asynchrony does not give each layer an independent horizon that software could set.</title>

        <text x="468" y="190" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">arrival records activate local work</text><text x="468" y="217" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">at their own physical times</text><rect x="452" y="458" width="296" height="126" rx="8" fill="#FFFF66" stroke="#000" stroke-width="1.8"/><text x="471" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What T means</text><text x="471" y="518" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">An encoder or simulator window.</text><text x="471" y="544" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">Not a native execution schedule.</text><text x="471" y="570" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">No per-layer horizon follows from it.</text><rect class="f11-band" x="425" y="105" width="350" height="530" rx="10" fill="#D63A2F" opacity="0"/>
      </g>

        <rect x="812" y="105" width="350" height="530" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/><path d="M812,148 V115 A10,10 0 0 1 822,105 H1152 A10,10 0 0 1 1162,115 V148 Z" fill="#F9D4EA"/><line x1="812" y1="148" x2="1162" y2="148" stroke="#000" stroke-width="2.2"/>

        <path d="M862 390 C895 350 908 377 930 326 S968 251 990 310 S1033 389 1051 279 S1090 250 1120 224" fill="none" stroke="#6B8CBE" stroke-width="4.6"/><g stroke="#8a94a0" stroke-width="2"><line x1="905" y1="237" x2="905" y2="421"/><line x1="982" y1="237" x2="982" y2="421"/><line x1="1058" y1="237" x2="1058" y2="421"/></g><text x="987" y="190" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">digital control samples a continuous state</text>

      <rect x="38" y="670" width="1124" height="72" rx="10" fill="#d5dbe2" stroke="#000" stroke-width="2"/><text x="600" y="701" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700" fill="#000">A lower timestep count is an algorithmic result. A lower measured latency requires a stated target and boundary.</text><text x="600" y="727" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">Conceptual lanes. No measured platform quantity is drawn. Do not substitute T or a simulator window for physical time.</text>

  <div class="fig-hint">Hover a panel for the execution assumption it makes explicit.</div>
  <figcaption><b>Figure 11:</b> Conceptual illustration of how algorithmic steps, asynchronous events, continuous dynamics, and wall-clock time relate under three execution models; no lane carries a measured platform quantity. Under a shared global step every core advances the same index \(t\), drawn here with a barrier handshake that holds every core until the slowest finishes, although a fixed-duration timer tick advances the same index by a different mechanism, so not every synchronous implementation is the same mechanism. Under asynchronous event-driven execution work is triggered by each arrival at its own physical time, there is no chip-wide step, and asynchrony inside a core does not by itself give each layer an independent horizon. Under analog continuous dynamics the state evolves in physical time \(\tau\) and a digital controller only samples it. A reported \(T\) therefore means a count of synchronized updates, an encoder or simulator window, or a sampling choice, and in none of the three does it establish a wall-clock latency.</figcaption>
</figure>
