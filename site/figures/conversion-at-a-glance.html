<!-- Conceptual figure; no measured quantity is drawn. Provenance of every drawn phrase, symbol and landmark. Band A (the shared idea): Section 8.1 opening paragraph of site/sec-08.html (Cao et al. 2015, ReLU-based ANNs converted to SNNs of IF neurons under rate coding; for nonnegative activations an IF neuron's spike count over a time window approximates the ANN activation); Section 8.1.1 (a trained network whose weights are kept, nothing retrained); Section 8.1.2 (the firing fraction rho(T) = N(T)/T and its correspondence with the activation over the scale, a/lambda); Section 8.1.4 (the per-layer scale lambda and the threshold set to it, theta = lambda); Section 8.1 second paragraph and Section 8.2.3 (reset by subtraction as the reset rule the framework needs); Section 8.3 opener and Section 8.3.1 to 8.3.5 (every classical and low-latency method changes something inside the conversion step). Symbols follow the staged notation of Section 3.2: theta threshold, lambda scale, rho(T) firing fraction, N(T) spike count, T horizon, W weights, a activation. Band B (the landmark rail), in the visual language of the strip of Figure 3 (lineage-tree.html) and Figure 4 (hardware-lineages.html); ring fills are Figure 3's own, classical #CFE2F3 for Section 8.1, low-latency #F9D4EA for Sections 8.2 and 8.3, toward hardware #FFDDA6 for Section 8.4. Labels and hover sentences by registry key and the Section 8 sentence they come from: perez-carrasco-2013, 8.1 opening paragraph (first framework, sigmoid ANNs to LIF SNNs by scaling synaptic weights); cao-2015, 8.1 opening paragraph (ReLU-based ANNs to SNNs of IF neurons under rate coding, the framework this part derives); diehl, 8.1 second paragraph (data-based weight and threshold normalization from a network's own activation statistics); rueckauer, 8.1 second paragraph (reset-by-subtraction fixed as the reset rule the framework needs, keeping the residual charge a hard reset discards); sengupta, 8.1 second paragraph (SPIKE-NORM extended to VGG and residual architectures, calibration constant estimated online from a short simulation); rmp, 8.2.3 (residual membrane potential problem formalized for deep and residual architectures under uniform hard reset); ding-2021-optimalconv, 8.1.7 (layer-by-layer firing-rate correspondence stated and proved for general feedforward and residual architectures); snn-calibration, 8.4.2 (Li et al.'s calibration of bias, weight and initial-membrane-potential statistics on a network already converted); qcfs, 8.3 opener and 8.3.1 (QCFS activation, a few steps with one shared budget for every layer); srp, 8.3 opener and 8.3.2 (SRP, residual membrane potential, four steps with one shared budget); fast-snn, 8.2.4 and 8.3.1 (a quantized ANN converted, signed spike representation with a learned clipping range); quartz, 8.3.6 and 8.4.1 (time-to-first-spike conversion, each neuron fires at most once, measured on a Nahuku 32 Loihi 1 board); pascal, 8.3.1 and 8.3.4 (spike accumulation, per-layer quantization step from each layer's activation histogram); mt-snn-frontiers-2026, 8.3.4 (mixed timesteps, the conversion route to a per-layer horizon). Drawing conventions: panel boxes, header band, arrow markers, hover bands and the palette from Figure 25 (relu-firing-fraction-correspondence.html); rail line, rings, year and label rows from the strips of Figures 3 and 4. Years are publication years; spacing along the rail is even and carries no meaning. -->
<svg viewBox="0 0 1200 488" role="img" aria-labelledby="f24-title f24-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f24-title">ANN-to-SNN conversion at a glance, the idea every method of this section shares above and the fourteen works that fixed it on one rail below</title>
  <desc id="f24-desc">Two bands. The upper band reads left to right through three boxes joined by arrows. Trained ANN, a small three-layer network glyph with a ReLU curve beside it and the lines weights W, trained once, and ReLU activations a ≥ 0. Conversion, the middle box drawn with a heavier outline, showing a ReLU curve turned into an IF unit with θ = λ that emits spikes, and the lines keep the weights W; replace each ReLU by an IF unit, threshold θ set to the activation scale λ, reset by subtraction; choose a horizon T; nothing is retrained. SNN run for T steps, the same network glyph with three spike rasters beside it and the lines the same W, spikes in place of activations, and firing fraction ρ(T) = N(T)/T ≈ a/λ. A bracket under the middle box reads that every classical and low-latency method of this section changes what enters this box or what happens inside it. The lower band is a landmark rail headed Landmarks in order of year, spacing not to scale, with a key of three ring fills, classical for Section 8.1, low-latency for Sections 8.2 and 8.3, toward hardware for Section 8.4. Fourteen rings sit evenly along the rail with the year above and the label below, in order, 2013 Pérez-Carrasco, 2015 Cao ReLU to IF, 2015 Diehl normalization, 2017 Rueckauer soft reset, 2019 Sengupta SPIKE-NORM, 2020 Han RMP-SNN, 2021 Ding correspondence, 2021 Li calibration, 2022 Bu QCFS, 2023 Hao SRP, 2023 Fast-SNN, 2024 Quartz TTFS on Loihi, 2025 PASCAL, 2026 MT-SNN. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 24:</b> ANN-to-SNN conversion at a glance, and the works that fixed it. Above, the idea every method of this section shares, a trained network whose weights are kept, whose ReLU units are replaced by integrate-and-fire units with the threshold set to the activation scale, and which then runs for \(T\) steps so that each unit's firing fraction stands in for its activation; every classical and low-latency method changes what enters the conversion box or what happens inside it. Below, the landmarks of this section on one rail in order of year, spacing not to scale, Pérez-Carrasco et al.'s first framework<d-cite key="perez-carrasco-2013"></d-cite>, Cao et al.'s ReLU-to-IF conversion under rate coding<d-cite key="cao-2015"></d-cite>, Diehl et al.'s weight and threshold normalization<d-cite key="diehl"></d-cite>, Rueckauer et al.'s reset by subtraction<d-cite key="rueckauer"></d-cite>, Sengupta et al.'s SPIKE-NORM<d-cite key="sengupta"></d-cite>, Han et al.'s residual membrane potential neuron<d-cite key="rmp"></d-cite>, Ding et al.'s layer-by-layer correspondence<d-cite key="ding-2021-optimalconv"></d-cite>, Li et al.'s calibration of a converted network<d-cite key="snn-calibration"></d-cite>, Bu et al.'s QCFS<d-cite key="qcfs"></d-cite>, Hao et al.'s SRP<d-cite key="srp"></d-cite>, Fast-SNN's conversion of a quantized network<d-cite key="fast-snn"></d-cite>, Quartz's time-to-first-spike conversion measured on Loihi<d-cite key="quartz"></d-cite>, PASCAL's spike accumulation<d-cite key="pascal"></d-cite>, and MT-SNN's mixed timesteps<d-cite key="mt-snn-frontiers-2026"></d-cite>. Ring fills name the part of this section that takes each work up, classical conversion, low-latency conversion, or conversion toward hardware. Conceptual figure; no measured quantity is drawn.</figcaption>
