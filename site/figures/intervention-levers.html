<!-- Conceptual figure; no measured quantity is drawn. Every drawn phrase is read from Section 8.3 of site/sec-08.html. The three lever names, the sentence under each (acts before conversion, on the ANN's own training objective; acts on the spiking neuron itself; acts on how the network's values are carried in time), the sentence in the 8.4 box (the three families start from the target), and the pairing of each subsection with its lever are the 8.3 lead paragraph and the first paragraph of 8.4. The strip vocabulary (Trained ANN, Parameter mapping, thresholds and weights, Readout, the horizon T) is Figure 21's. The activation column is the first paragraph of 8.3.1 (training the ANN's own activation function to anticipate the grid before conversion happens; Section 8.2.2's clipping and discretization error). The two neuron columns are the first paragraphs of 8.3.2 (changes what happens to membrane potential at the start of inference and at reset, keeping the classical IF neuron; the residual-and-reset error Section 8.2.3 attributes to reset-by-subtraction) and 8.3.3 (redesigns the IF neuron itself, changing what a single step's spike budget can represent; Section 8.2.2's clipping and discretization error). The three encoding columns are the first paragraphs of 8.3.4 Mixed and Heterogeneous Timesteps (one global T shared by every layer replaced by a layer-specific horizon; Section 8.2.4's unevenness and timing error), 8.3.5 (a single, whole-network terminal horizon per input, stopping every layer together; the same finite-window error as 8.3.4), and 8.3.6 (replacing the encoder, channel, and decoder with a different code entirely; Section 8.2.6's encoding and readout error). The red markers reuse Figure 23's convention for a finite-time error term. -->
<svg viewBox="0 0 1200 520" role="img" aria-labelledby="f24-title f24-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f24-title">The three levers of low-latency conversion, the activation lever, the neuron lever, and the encoding lever, drawn on the classical pipeline at the element each one acts on, with the subsections that pull each lever and the finite-time error each one targets</title>
  <desc id="f24-desc">A row of boxes read left to right and joined by arrows, the classical pipeline reduced to what a lever can touch. Trained ANN, its activation function. Parameter mapping, thresholds and weights, drawn small because no lever pulls on it. Spiking neuron, integrate, threshold, reset. Time, the horizon T and the code. A small terminal Readout. To the far right, apart from the row, a muted dashed box reads 8.4 Conversion toward hardware, methods that start from the target. Above the row three colored brackets reach down onto three boxes. The green activation lever reaches the trained ANN and acts before conversion, on the ANN's own training objective. The blue neuron lever reaches the spiking neuron and acts on the spiking neuron itself. The amber encoding lever reaches the time box and acts on how the network's values are carried in time. Below the row, under each lever, the subsections that pull it. Under the activation lever, Section 8.3.1 Activation shaping, train the activation to anticipate the grid before conversion, against clipping and discretization error, Section 8.2.2. Under the neuron lever, Section 8.3.2 Potential and reset calibration, calibrate the initial potential and the reset of the IF neuron, against residual and reset error, Section 8.2.3, and Section 8.3.3 Neuron interventions, redesign the IF neuron itself, changing what one step's spike budget can represent, against clipping and discretization error, Section 8.2.2. Under the encoding lever, Section 8.3.4 Mixed and heterogeneous timesteps, a horizon that varies by layer, not one global T shared by every layer, against unevenness and timing error, Section 8.2.4; Section 8.3.5 Adaptive inference, a single whole-network horizon that varies by input, stopping every layer together, against the same finite-window error, Section 8.2.4; and Section 8.3.6 Alternative-code conversion, replace the rate code itself with a different code for the encoder, channel, and decoder, against encoding and readout error, Section 8.2.6. Each targeted error is marked with a red dot. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 24:</b> The three levers by which Section 8.3 organizes low-latency conversion, drawn on the classical pipeline reduced to what a lever can touch, the trained ANN and its activation function, the spiking neuron, the time over which values are carried, and the readout, with parameter mapping between them drawn plain because none of the three levers acts on conversion itself. The activation lever acts before conversion, on the ANN's own training objective (Section 8.3.1); the neuron lever acts on the spiking neuron itself, by calibrating its initial potential and reset (Section 8.3.2) or by redesigning the neuron model (Section 8.3.3); the encoding lever acts on how the network's values are carried in time, with a horizon that varies by layer (Section 8.3.4) or by input (Section 8.3.5), or with a different code in place of rate (Section 8.3.6). Activation shaping and neuron interventions target the clipping and discretization error of Section 8.2.2, potential and reset calibration the residual and reset error of Section 8.2.3, mixed timesteps and adaptive inference the unevenness and timing error of Section 8.2.4, and alternative-code conversion the encoding and readout error of Section 8.2.6. The methods of Section 8.4 start from the target rather than from an error term, so they sit past the pipeline instead of on it. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
