<figure class="pfig l-body" id="figure-16">
  <div style="max-width: 720px; margin: 0 auto;">
    <svg viewBox="0 0 1200 790" role="img" aria-labelledby="f16title f16desc">
      <title id="f16title">Why one timestep is not one universal unit of execution</title>
      <desc id="f16desc">Clocked cores synchronize at barriers. Asynchronous hardware progresses on event arrival without a global timestep. Analog circuits evolve continuously and are sampled by digital control logic.</desc>
      <defs><marker id="f16arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs>
      <text x="600" y="42" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700" fill="#000">One algorithmic step does not have one hardware meaning</text>
      <text x="600" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">The execution model determines whether a software horizon maps to barriers, event arrivals, or sampled continuous dynamics.</text>

      <g class="f16-hot"><title>In a clocked substrate, every component advances the same algorithmic index only after a barrier. The physical duration of one tick can vary with work, traffic, and scheduling.</title>
        <rect x="38" y="105" width="350" height="530" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/><path d="M38,148 V115 A10,10 0 0 1 48,105 H378 A10,10 0 0 1 388,115 V148 Z" fill="#CFE2F3"/><line x1="38" y1="148" x2="388" y2="148" stroke="#000" stroke-width="2.2"/>
        <text x="213" y="135" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700" fill="#000">Clocked global tick</text><text x="65" y="187" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">algorithmic index: t, t+1, t+2</text>
        <g stroke="#000" stroke-width="2"><line x1="92" y1="237" x2="340" y2="237"/><line x1="92" y1="298" x2="340" y2="298"/><line x1="92" y1="359" x2="340" y2="359"/></g>
        <g fill="#CDEBCD" stroke="#000" stroke-width="1.5"><rect x="99" y="220" width="72" height="17"/><rect x="99" y="281" width="140" height="17"/><rect x="99" y="342" width="104" height="17"/><rect x="213" y="220" width="93" height="17"/><rect x="265" y="281" width="75" height="17"/><rect x="229" y="342" width="111" height="17"/></g>
        <g style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000"><text x="52" y="242">core A</text><text x="52" y="303">core B</text><text x="52" y="364">core C</text></g><g stroke="#D63A2F" stroke-width="3" stroke-dasharray="7 5"><line x1="183" y1="205" x2="183" y2="389"/><line x1="348" y1="205" x2="348" y2="389"/></g>
        <text x="183" y="416" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700" fill="#D63A2F">barrier</text><text x="348" y="416" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700" fill="#D63A2F">barrier</text>
        <rect x="65" y="458" width="296" height="126" rx="8" fill="#FFFF66" stroke="#000" stroke-width="1.8"/><text x="84" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What T means</text><text x="84" y="520" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">A sequence of synchronized updates.</text><text x="84" y="550" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Tick duration is not fixed by T alone.</text><rect class="f16-band" x="38" y="105" width="350" height="530" rx="10" fill="#D63A2F" opacity="0"/>
      </g>

      <g class="f16-hot"><title>In a genuinely event-driven substrate, each computation is triggered by an arriving event. There is no shared layer or chip timestep that software can set independently.</title>
        <rect x="425" y="105" width="350" height="530" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/><path d="M425,148 V115 A10,10 0 0 1 435,105 H765 A10,10 0 0 1 775,115 V148 Z" fill="#CDEBCD"/><line x1="425" y1="148" x2="775" y2="148" stroke="#000" stroke-width="2.2"/>
        <text x="600" y="135" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700" fill="#000">Asynchronous events</text><line x1="468" y1="421" x2="739" y2="421" stroke="#000" stroke-width="2.2" marker-end="url(#f16arr)"/><text x="739" y="447" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">wall-clock time</text>
        <g fill="#D63A2F" stroke="#000" stroke-width="1.5"><path d="M492 421 V365 H504 V421 Z"/><path d="M578 421 V292 H590 V421 Z"/><path d="M665 421 V330 H677 V421 Z"/></g><g fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#f16arr)"><path d="M504 365 C527 365 537 352 552 338"/><path d="M590 292 C612 292 622 306 638 320"/><path d="M677 330 C698 330 706 317 722 304"/></g><g fill="#F9D4EA" stroke="#000" stroke-width="1.8"><rect x="545" y="319" width="39" height="38" rx="7"/><rect x="631" y="301" width="39" height="38" rx="7"/><rect x="715" y="284" width="39" height="38" rx="7"/></g>
        <text x="468" y="190" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">arrival records activate local work</text><text x="468" y="217" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">at their own physical times</text><rect x="452" y="458" width="296" height="126" rx="8" fill="#FFFF66" stroke="#000" stroke-width="1.8"/><text x="471" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What T means</text><text x="471" y="520" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">An encoder or simulator window.</text><text x="471" y="550" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">It is not a native execution schedule.</text><rect class="f16-band" x="425" y="105" width="350" height="530" rx="10" fill="#D63A2F" opacity="0"/>
      </g>

      <g class="f16-hot"><title>Analog neuromorphic circuits evolve continuously. Digital software can choose when to sample or control them, but those control frames are not the differential equation's native time axis.</title>
        <rect x="812" y="105" width="350" height="530" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/><path d="M812,148 V115 A10,10 0 0 1 822,105 H1152 A10,10 0 0 1 1162,115 V148 Z" fill="#F9D4EA"/><line x1="812" y1="148" x2="1162" y2="148" stroke="#000" stroke-width="2.2"/>
        <text x="987" y="135" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:700" fill="#000">Analog continuous time</text><line x1="856" y1="421" x2="1126" y2="421" stroke="#000" stroke-width="2.2" marker-end="url(#f16arr)"/><line x1="856" y1="421" x2="856" y2="218" stroke="#000" stroke-width="2.2" marker-end="url(#f16arr)"/><text x="1126" y="447" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">physical time τ</text><text x="841" y="229" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">V(τ)</text>
        <path d="M862 390 C895 350 908 377 930 326 S968 251 990 310 S1033 389 1051 279 S1090 250 1120 224" fill="none" stroke="#D63A2F" stroke-width="4"/><g stroke="#2f6fa8" stroke-width="2" stroke-dasharray="5 5"><line x1="905" y1="237" x2="905" y2="421"/><line x1="982" y1="237" x2="982" y2="421"/><line x1="1058" y1="237" x2="1058" y2="421"/></g><text x="987" y="190" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">digital control samples a continuous state</text>
        <rect x="839" y="458" width="296" height="126" rx="8" fill="#FFFF66" stroke="#000" stroke-width="1.8"/><text x="858" y="490" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What T means</text><text x="858" y="520" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">A discretization or control choice.</text><text x="858" y="550" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Native state evolves in physical τ.</text><rect class="f16-band" x="812" y="105" width="350" height="530" rx="10" fill="#D63A2F" opacity="0"/>
      </g>
      <rect x="38" y="670" width="1124" height="72" rx="10" fill="#d5dbe2" stroke="#000" stroke-width="2"/><text x="600" y="701" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700" fill="#000">A lower timestep count is an algorithmic result. A lower measured latency requires a stated target and boundary.</text><text x="600" y="727" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">Do not substitute T, spike count, or a simulator window for physical time without an execution-model argument.</text>
    </svg>
  </div>
  <div class="fig-hint">Hover a panel for the execution assumption it makes explicit.</div>
  <figcaption><b>Figure 16:</b> An algorithmic horizon has distinct meanings under clocked, asynchronous, and analog-continuous execution. Global-tick systems advance a synchronized index through barriers. Event-driven substrates react to timestamped arrivals without a native global timestep. Analog circuits evolve in continuous physical time and are sampled or controlled digitally. Thus, a reported \(T\) cannot by itself establish a hardware latency.</figcaption>
</figure>
