<!-- Provenance (conceptual figure; the trace is a schematic and not a recording).
     Source: W. Gerstner, W. M. Kistler, R. Naud and L. Paninski, Neuronal Dynamics, Cambridge University Press, 2014,
     registered as gerstner2014-neuronal-dynamics in data/foundations-sources.json, Chapter 1 read in the authors'
     online edition on 2026-09-17. Locator, then the number drawn.
     Ch. 1, Sec. 1.1: the three functional parts (dendrites as input, soma as the integrating and thresholding part,
       axon as output); the chemical synapse (axon terminal, synaptic cleft, transmitter release, receptors, ion
       channel opening, postsynaptic potential); the action potential amplitude of about 100 mV and duration of
       1 to 2 ms; the absolute and then the relative refractory period.
     Ch. 1, Sec. 1.2: the resting potential of about minus 65 mV; excitatory and inhibitory postsynaptic potentials;
       their approximately linear summation; the firing threshold.
     Numbers drawn: rest about minus 65 mV (axis tick and label); pulse amplitude about 100 mV (bracket from rest
       to peak, peak drawn at plus 35 mV); pulse width about 1 to 2 ms (annotation; the drawn pulse is 1.5 ms wide
       on the time axis). The source puts the threshold about 20 to 30 mV above rest (Sec. 1.2); the line is drawn 20 mV above rest and carries no number.
       Single EPSPs are about 1 mV in the source; the drawn postsynaptic potentials are about ten times larger so that their
       summation is visible, a schematic exaggeration stated in the caption. The vesicles in the synapse inset are the standard
       depiction of a presynaptic terminal and are not described in the cited chapter; the caption follows the source and says
       transmitter is released from the terminal.
     Schematic choices that are not measurements: postsynaptic potential kernel exp(-s/5 ms) - exp(-s/0.8 ms)
       normalized to its peak; input arrivals at 3 ms (+10 mV), 8 ms (-9 mV), 15 ms (+12 mV), 17 ms (+12 mV);
       sinusoidal rise over 0.45 ms and cosine fall over 1.05 ms to an undershoot of minus 75 mV; recovery with a
       5 ms time constant; absolute refractory bracket 2.2 ms long, relative refractory bracket the following 10 ms.
     No myelin and no node of Ranvier are drawn because the cited chapter does not describe them. -->
  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1340 1000" role="img" aria-labelledby="f2title f2desc">
    <title id="f2title">The biological neuron in the neuroscience vocabulary, its membrane potential at the soma, and its chemical synapse</title>
    <desc id="f2desc">Three panels. The top panel draws one neuron with branching dendrites receiving three presynaptic axon terminals, two excitatory and one inhibitory, a soma, an axon leaving the soma, and axon terminals contacting the dendrite of a second, partly drawn cell, with the direction of signal flow marked from left to right. The lower left panel draws a schematic trace of membrane potential in millivolts against time in milliseconds. The trace rests at about minus 65 millivolts, rises with one excitatory postsynaptic potential, dips with one inhibitory postsynaptic potential, climbs to the threshold when two excitatory potentials sum, fires an action potential of about 100 millivolts lasting about one to two milliseconds, undershoots briefly, and returns to rest. Brackets mark the absolute and relative refractory periods, and one red tick above the trace marks the spike as the axon carries it. The lower right panel enlarges a chemical synapse with a presynaptic terminal holding vesicles, the synaptic cleft, a postsynaptic membrane with receptors and an ion channel, arrows for transmitter release and ion flow, and the words excitatory (depolarizing) and inhibitory (hyperpolarizing) beside the postsynaptic side.</desc>

<figcaption><b>Figure 2:</b> The biological neuron in the neuroscience vocabulary, the object that every later vocabulary renames, receives input on its dendrites, integrates it at the soma, and sends a pulse down its axon to other cells. The top panel draws one cell with two excitatory and one inhibitory presynaptic terminal on its dendrites and its axon terminals on the dendrite of a second cell; each contact is a synapse. In the membrane potential panel, following Gerstner et al.<d-cite key="gerstner2014-neuronal-dynamics"></d-cite>, the potential rests at about &#8722;65 mV, excitatory and inhibitory postsynaptic potentials move it up and down and sum, and when the sum crosses the threshold, about 20 to 30 mV above rest, the cell fires an action potential of about 100 mV that typically lasts one to two milliseconds and ends in a brief undershoot. Single postsynaptic potentials are near one millivolt in the source and are drawn larger so that their summation can be seen. An absolute refractory period, during which no second pulse can fire, precedes a relative one, during which firing is harder. The synapse panel enlarges the chemical synapse, where transmitter released from the presynaptic terminal crosses the cleft, binds receptors, and opens an ion channel. The trace is a schematic, not a recording, and the figure is a conceptual illustration whose numbers come from the cited source.</figcaption>
</figure>
