<svg viewBox="0 0 1200 970" role="img" aria-labelledby="f22-title f22-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="18">
  <title id="f22-title">The eleven fields of the deployable SNN contract as one checklist, each field asked the three independent questions of Section 9.3, written by both learning branches and read by software and by silicon</title>
  <desc id="f22-desc">A diagram read top to bottom. A dashed band labeled whichever route produces the weights holds two boxes side by side, Section 7, Direct SNN Training, and Section 8, ANN-to-SNN Conversion. Both join into one arrow labeled must both make every field explicit, which enters a gold card titled Section 9, The Deployable SNN Contract, the checklist of Table 21, applied platform by platform and route by route. The card is a grid. Its eleven rows are the fields of Table 21 in order, network graph and supported operators, neuron equations and update order, synaptic dynamics and delays, threshold and reset semantics, neural code and spike payload, input encoder and output decoder, precision for weights, thresholds, and state, time model and termination condition, connectivity, fan-in, fan-out, and routing, plasticity and state persistence, and required host-side operations. Its three columns are the questions of Section 9.3, definition, asking whether the field is mathematically defined, answered in Sections 3 and 4, representation, asking whether a software framework can represent it, answered in Section 10, and execution, asking whether the target can execute it without changing what the network computes, answered in Sections 5 and 11. Every cell holds an empty slot. A footer states that the three are independent tests asked of every field, and that a field can fail any one of them while passing the other two. Two arrows leave the card into a dashed band labeled representable in software, executable on a target, which holds Section 10, Software, Interchange, and Compilation, answering the representation question edge by edge, and Section 5, Where an SNN Runs, answering the execution question per platform. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 22:</b> The deployable SNN contract of Section 9.2 as one card, the contract node of Figure 1 drawn in full. Its eleven fields are the rows of Table 21, and every row faces the three independent questions of Section 9.3, mathematical definition, software representation, and faithful execution, so the card is a checklist rather than a verdict. Both learning branches write the card, and the software of Section 10 and the targets of Section 5 read it, the first answering the representation question edge by edge and the second answering the execution question per platform. Conceptual figure; no measured quantity is drawn.</figcaption>
