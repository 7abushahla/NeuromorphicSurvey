  <figcaption><b>Figure 13:</b> The five spiking neuron models of Section 3.3 and one emission-semantics panel, each shown with the state it carries, its discrete-time update, and a membrane trace derived from that update under a comparable drive, a constant input or, where the synaptic stage is the point, a train of input events. Every model after the first adds one mechanism the integrate-and-fire baseline lacks, a leak, a filtered input current, a self-raising threshold, or a second compartment. The sixth panel changes what the emission stage produces, a signed event, and not the membrane dynamics underneath it, so it is a payload property rather than a sixth model. This original panel set keeps its own symbols, \(V\) for the state written \(u\) elsewhere in the survey and \(V_{\mathrm{th}}\) for the threshold \(\theta\), and its traces are drawn under reset-by-subtraction. Platform labels record documented statuses for a named target and are not measurements, and the Loihi workaround in the multi-compartment panel is documented to cost a second compartment per affected neuron; which model a substrate executes natively and which it must emulate is the axis of Section 12 (hardware execution models).</figcaption>
</figure>
