  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1180 760" role="img" aria-labelledby="f3title f3desc">
    <title id="f3title">Parallel layer computations in an artificial neural network and a spiking neural network</title>
    <desc id="f3desc">Conceptual illustration. The upper path represents values through a weighted aggregation and static nonlinearity. The lower path represents discrete events, accumulates arriving events into persistent state, applies a threshold and reset, then emits events. A bottom strip separates activity sparsity from conditional execution and states that either representation can be executed densely or conditionally.</desc>

    </defs>

    <text x="46" y="44" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700" fill="#000">One layer, two representations</text>
    <text x="46" y="72" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">The representation fixes what is carried between units. The execution schedule is a separate implementation choice.</text>

      <title>An ANN layer carries a real-valued activation. Its value is complete for the current evaluation, even if that value happens to be zero.</title>

      <text x="134" y="200" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">real-valued</text>
      <text x="134" y="224" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">activation</text>
      <text x="134" y="258" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:25px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">a</tspan><tspan dy="6" style="font-size:16px">j</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif"> ∈ ℝ</tspan></text>
      <rect class="f3-band" x="42" y="102" width="184" height="212" rx="10" fill="#6AA168" opacity="0"/>

    </g>

    <g class="f3-hot">
      <title>Weighted aggregation combines every input value with its associated weight. This diagram is a computation model, not a promise that every implementation performs a dense MAC for every zero.</title>
      <rect x="260" y="164" width="190" height="102" rx="8" fill="#CDEBCD" stroke="#000" stroke-width="2.2"/>
      <text x="355" y="194" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Weighted</text>

  <div class="fig-hint">Hover a block for the represented quantity, state transition, or execution claim it separates.</div>
  <figcaption><b>Figure 3:</b> Conceptual illustration of one layer under the two representations of Section 2.1. In the ANN path, values enter a weighted aggregation, a static nonlinearity is evaluated once for the input presentation, and values leave the layer with no state carried to a later step. In the SNN path, events trigger weighted accumulation into a persistent state \(u_i[t]\), the state is tested against the threshold \(\theta\), the reset rule is applied after an emission, and events leave the layer. For a binary or unit-payload event with a fixed synaptic weight, an arriving event selects and accumulates a known weight without a runtime multiplication; a graded payload may instead require a multiplication or another transformed operation. The bottom strip keeps representation, activity sparsity, and conditional execution apart. A dense tensor can be executed with zero skipping and an event representation can be simulated densely, so few events at a step neither prove nor require that a substrate skipped work, and only a measurement on that substrate establishes it.</figcaption>
</figure>
