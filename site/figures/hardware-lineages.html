    <title id="f4title">Two hardware lineages side by side, the conventional machine that simulates an SNN and the neuromorphic circuit that implements it</title>
    <desc id="f4desc">Two dated columns aligned level by level with a gray rail between them, both opening at the same row. The left column is conventional digital hardware, the machine every reader knows. It opens with the stored-program machine of von Neumann's 1945 report, which holds instructions and numbers in one memory apart from the arithmetic organ, drawn level with Mead's 1990 paper on the right, with a small clock box hanging beside it, every step synchronous and gated by a central clock. An arrow leads down to the transistor of 1948, a switch that is on or off, drawn level with the right column's subthreshold transistor, then to logic families (TTL, then CMOS in 1963, which draws power chiefly when it switches), then past an empty row to the memory hierarchy, which moves words one at a time between processor and memory, the von Neumann bottleneck. A dashed group labeled the machine on a chip holds the microprocessor of 1971, RISC of 1980 to RISC-V of 2011, GPU and NPU as arrays of clocked multiply-accumulate units such as the TPU's systolic array of 2017, and, drawn with a dashed outline, Akida as the survey's event NPU, a converted CNN run as events with the parameter memory integrated in the processor, which is in the frame as a deployment target the survey audits because its workload is a converted CNN, while no page documents address events, physical time, a silicon-neuron ancestry, or an instruction stream, and the bottom line below is not claimed for it. A framed bottom line reads, an ANN is a program, a weight is a word in memory, a multiply-accumulate is an instruction, time is the clock. The right column is neuromorphic hardware, the circuit that implements. It opens with Mead in 1990, implement the computation rather than simulate it, then the subthreshold transistor of Mead's 1989 book, the same transistor run as an analog element whose physics mirrors the neuron's. Then, past an empty row, the silicon neuron of 1991, a circuit whose dynamics are the neuron's, then address-event representation of 1992 and 2000, addresses on a shared bus with implicit timing and no clock. A dashed group labeled the circuit on a chip holds the digital neuromorphic cores TrueNorth of 2014 and Loihi of 2018 with synapse memory beside the neuron, the accelerated analog BrainScaleS, and the many-core SpiNNaker with conventional ARM cores inside a neuromorphic packet router. Its framed bottom line reads, an SNN is the circuit's dynamics, a weight is synapse state beside the neuron, a spike is an event, time is physics or the event itself. The rail names five contrasts at the matching rows, what a program is at the opening row, what the transistor does at the transistor row, how time passes at the silicon neuron row, how units talk at the memory hierarchy and address-event row, and where memory is at the digital cores row. Three dashed crossings join the columns, from SpiNNaker back to the microprocessor level as the first crossing, from the right bottom line to the left bottom line as a simulator that runs the right column's equations on the left column's machine, the second crossing, and from Akida in the left frame into the circuit-on-a-chip frame as the third crossing, the parameter memory integrated with the neuronal mathematics and events, which is what the pages give the neuromorphic side. A strip along the bottom lists both lineages' dated nodes in year order with even spacing, colored by column.</desc>

  <figcaption><b>Figure 4:</b> An ANN runs on the clocked stored-program machine, an SNN on a circuit that is the neuron, and the rail names what the circuit changes. The left column opens with von Neumann's 1945 report<d-cite key="vonneumann1945-edvac"></d-cite>, whose stored-program machine predates the transistor it was built from and clocks every step, then runs through the transistor of Bardeen and Brattain<d-cite key="bardeen1948-transistor"></d-cite> and through TTL and CMOS gates, Horowitz and Hill<d-cite key="horowitz2015-art-of-electronics"></d-cite> and Wanlass and Sah<d-cite key="wanlass1963-cmos"></d-cite>, to the memory hierarchy whose bottleneck Backus<d-cite key="backus1978-von-neumann-style"></d-cite> named. The chip frame holds the 4004 of 1971 that Faggin et al.<d-cite key="faggin1996-4004"></d-cite> recount, the small instruction set of Patterson and Ditzel<d-cite key="patterson1980-risc"></d-cite> that Waterman et al.<d-cite key="waterman2011-riscv"></d-cite> opened as RISC-V, and the TPU of Jouppi et al.<d-cite key="jouppi2017-tpu"></d-cite>. Akida, drawn as the survey's event NPU with a dashed outline inside the same frame, is the event domain processor of BrainChip's tech brief<d-cite key="brainchip-akida-techbrief"></d-cite>, in which events or spikes indicate useful information and the parameter memory is integrated with the neuronal mathematics, the event-based neural network processor of the AKD1000 product brief<d-cite key="BrainChip-AKD1000Brief"></d-cite>, and the target of the CNN2SNN guide<d-cite key="brainchip-cnn2snn-docs"></d-cite> that converts trained CNNs for its runtime, and it sits on the machine side as a deployment target this survey audits because its workload is a converted CNN, while none of those pages documents address events, physical time, a silicon-neuron ancestry, or an instruction stream. On that machine an ANN is a program, a weight a word in memory, a multiply-accumulate an instruction, and time the clock. The right column opens with Mead<d-cite key="mead1990"></d-cite>, implement rather than simulate, and rests on the subthreshold transistor of Mead's 1989 book<d-cite key="mead1989-analog-vlsi"></d-cite>, whose physics mirrors the neuron's. Mahowald and Douglas<d-cite key="mahowald1991-silicon-neuron"></d-cite> built a circuit whose dynamics are the neuron's, and address-event representation, Mahowald<d-cite key="mahowald1992-aer"></d-cite> and Boahen<d-cite key="boahen2000-aer"></d-cite>, carries addresses with no clock. TrueNorth of Merolla et al.<d-cite key="merolla2014-truenorth"></d-cite> and Loihi of Davies et al.<d-cite key="loihi1"></d-cite> keep synapse memory beside digital cores, BrainScaleS-2 of Pehle et al.<d-cite key="bss"></d-cite> runs neuron circuits faster than biology, and SpiNNaker of Furber et al.<d-cite key="furber2012-spinnaker"></d-cite> puts ARM cores in a neuromorphic router. On that circuit an SNN is the circuit's dynamics, a weight synapse state beside the neuron, a spike an event, and time physics or the event itself. The dashed crossings are SpiNNaker's cores in a neuromorphic fabric, a simulator running the right column's equations on the left, and Akida carrying into the circuit frame what the pages give that side, parameter memory integrated with the neuronal mathematics and events. The dashed frames group chip families that share a level and assert no order among them. The strip is ordinal, and the figure is a conceptual illustration with dates from the cited sources, each column a dependency picture, not a claim that one work cites another.</figcaption>
