     Memory accesses cost more energy than arithmetic; horowitz-2014; ISSCC 2014, DOI 10.1109/isscc.2014.6757323.
     Address-event representation; boahen2000-aer; IEEE Trans. Circuits Syst. II vol. 47, pp. 416-434, DOI 10.1109/82.842110.
     Communication at level 3 is qualified per platform from data/platform-capabilities.json (contract fields connectivity_routing, neural_code_payload, neuron_dynamics, threshold_reset, time_termination; contract_requirement, support_detail, routing_constraints and source_locator read on 2026-09-17).
       spinnaker-1; spynnaker-v8-docs; multicast AER routing, source-addressed spike packets (address-event documented).
       speck-2f; synsense-speck-datasheet; address events carrying address, feature, polarity and timestamp, asynchronous event-driven compute (address-event documented).
       loihi-1; loihi2, Table 3; binary spike messages traverse the asynchronous mesh (address not named for the inter-core messages; the brief's External Interfaces section names asynchronous (AER) protocols and its body says all communication between neuron cores is in the form of spike messages, read 2026-09-17).

    <title id="f8title">A trained ANN or CNN on conventional hardware beside an SNN on neuromorphic hardware, level by level, with the two crossings between the paths</title>
    <desc id="f8desc">Two columns read from top to bottom through four aligned levels, with a gray rail between them naming what differs at each level. The left column is the conventional path. Its network is a trained ANN or CNN made of weighted sums and static activations that keeps no state between inputs. It is quantized and compiled to integer kernels, CMSIS-NN on Cortex-M and vendor libraries on CPU, GPU and NPU. It executes as dense matrix multiplies under a global clock, one pass per input frame, with weights and activations fetched through registers, SRAM or cache, and flash or DRAM, so memory sits apart from compute and the accesses cost more energy than the arithmetic. Its silicon row holds a Cortex-M microcontroller, a CPU, a GPU and an NPU, and beside them Akida drawn with a dashed outline as the survey's event NPU, with the sub-label event NPU, converted CNN, single event-domain pass, because its record documents a converted network run as events with no spiking model exposed and no address-event lineage. The right column is the neuromorphic path. Its network is a spiking neural network with the same layered weights, where each unit keeps a state, tests it against a threshold and emits events. It is converted or trained and then mapped by Lava, sPyNNaker, Sinabs, Rockpool, hxtorch or CNN2SNN. It executes as event-triggered state updates, with time stepped by the fabric or driven by the events, weights resident beside the neuron in the core, and events carried as messages, by address on the platforms whose documents state address-event communication, SpiNNaker, Speck and BrainScaleS, as spike messages over Loihi's asynchronous mesh, and as integer spike counts per synchronous step inside Xylo's fixed matrices. Its silicon row holds Loihi, SpiNNaker, BrainScaleS, Speck and Xylo. A dashed arrow from the left network to the right network is ANN-to-SNN conversion. A dashed path from the right network down to the left silicon row is an SNN simulated or accelerated on conventional silicon. A dotted two-headed line joins the two silicon rows and is labeled compared in deployment claims at a stated measurement boundary.</desc>

  <figcaption><b>Figure 8:</b> A trained ANN or CNN runs on conventional hardware as clocked matrix multiplies, an SNN runs on neuromorphic hardware as event-triggered state updates beside resident weights, and the paths cross at conversion and at an SNN run on conventional silicon. At the network level the left keeps no state between inputs and the right keeps a state per unit and emits events. At the compile level the ANN becomes the 8-bit and 16-bit CMSIS-NN kernels of Lai et al.<d-cite key="lai2018-cmsis-nn"></d-cite> on a Cortex-M microcontroller or vendor libraries elsewhere, while the SNN is converted or trained, then mapped by its toolchain. At the execution level the left fetches operands through a memory hierarchy whose accesses cost more energy than the arithmetic, as Horowitz<d-cite key="horowitz-2014"></d-cite> tabulated, while the right keeps the weight beside the neuron and carries events as messages. Those messages are address events in the sense of Boahen<d-cite key="boahen2000-aer"></d-cite> only where the platform's own documents state it, the multicast source-addressed packets of the sPyNNaker documentation<d-cite key="spynnaker-v8-docs"></d-cite>, the address, feature, polarity and timestamp events of the Speck datasheet<d-cite key="synsense-speck-datasheet"></d-cite>, and the address event-encoded packets that the BrainScaleS-2 event routing network operates on, in the words of Pehle et al.<d-cite key="bss"></d-cite>. The Loihi 2 comparison table<d-cite key="loihi2"></d-cite> records spike messages over an asynchronous mesh between neuron cores, and the same brief names AER only among the chip's external interfaces. The hxtorch documentation<d-cite key="hxtorch"></d-cite> records timestamped event messages through the BrainScaleS routing fabric without itself naming addresses, and the Xylo documentation<d-cite key="rockpool-xylo-docs"></d-cite> records integer spike counts per synchronous timestep inside fixed matrices. At the silicon level the left is clocked general-purpose silicon, a Cortex-M microcontroller, a CPU, a GPU and an NPU, and beside them Akida<d-cite key="brainchip-akida-user-guide"></d-cite>, drawn with a dashed outline as the survey's event NPU because its record documents a CNN converted by CNN2SNN<d-cite key="brainchip-cnn2snn-docs"></d-cite>, run as a single event-domain pass whose events carry low-bit activation information, with no spiking model exposed and no address-event lineage. The right holds the five neuromorphic families audited later, Loihi<d-cite key="loihi1"></d-cite>, SpiNNaker<d-cite key="furber2012-spinnaker"></d-cite>, BrainScaleS<d-cite key="bss"></d-cite>, Speck and Xylo. The dashed crossings are ANN-to-SNN conversion, the route this survey audits, and an SNN simulated or accelerated on conventional silicon, which Du et al.<d-cite key="prior-s36-du-2026"></d-cite> benchmark on edge devices and Farsa et al.<d-cite key="prior-s37-farsa-2026"></d-cite> survey for GPUs and RISC-V processors. The figure is a conceptual illustration and no measured quantity is drawn. The picture is not a partition.</figcaption>
