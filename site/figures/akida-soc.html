  <desc id="f19-desc">Two panels. On the left, a dashed frame in the conventional bucket&#8217;s blue tint labeled Akida AKD1000 system on chip. Along its top sit interface blocks USB 3.0, PCIe 2.1, I2S, I3C and UART; down its right side JTAG, LPDDR4 memory, and multi-chip expansion up to 32 devices over PCIe. In the middle a host processor block, an Arm Cortex-M4 CPU on the die, sits above a large block holding a grid of small squares labeled mesh of neural processing units, an interconnect network for spike transmission, grid not to count; the grid carries no count. On the left an input encoding block, rank coding, events by their time and place, points an arrow into the mesh. One square of the mesh is outlined and a dashed arrow leads from it to the right panel. The right panel, one neural processing unit opened, is drawn in the memory-and-circuit vocabulary of the preceding architecture figure. An input packet block sits at the top and an arrow leads down from it into a plain rounded box of neuron and synapse circuits that accumulate low-bit event-domain activations. A hatched block labeled Weights stands immediately beside that box, not above it or apart from it, and a bracket under the pair reads parameter memory integrated with the neuronal mathematics. A vertical ellipsis under the pair marks the circuits not drawn. An arrow leaves the circuits to the right into a threshold box, set at conversion, and from the threshold an arrow points down to the word Event, to the next layer. A key marks hatched as memory and plain as a neuron and synapse circuit, and a footer line reads that on the preceding figure&#8217;s axis this unit is the near-memory cell of panel (c). Under both panels the chip word event NPU and one line, memory beside the neuron, and a converted network run as one pass, no state over T. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 19:</b> BrainChip&#8217;s Akida as its own pages describe it. A host processor, an input encoding stage that expresses data as events by their time and place, and a mesh of neural processing units share one chip. The opened unit holds its parameter memory beside the neuron and synapse circuits that use it and draws power only when a neuron&#8217;s inputs cross its threshold<d-cite key="brainchip-akida-techbrief"></d-cite>, which is the memory placement of the neuromorphic panel of Figure 18 rather than that of a processor or a dense accelerator. What runs on the unit is a converted quantized CNN as one pass of sparse events, its threshold fixed once at conversion from the quantization step<d-cite key="brainchip-cnn2snn-docs"></d-cite> and no spiking neuron model integrated over T, which is why the chip carries the event NPU word of the conventional bucket rather than a place among the neuromorphic families that follow. The right panel is drawn in the memory-and-circuit vocabulary of the preceding figure, after the EdgeSNN survey&#8217;s architecture comparison<d-cite key="deng-2025-edgesnn"></d-cite>. Conceptual figure drawn from BrainChip&#8217;s documentation; no measured quantity is drawn.</figcaption>
</figure>
