<figcaption><b>Figure 19:</b> BrainChip's Akida as its own pages describe it. A host processor, an input encoding stage that expresses data as events by their time and place, and a mesh of neural processing units share one chip; inside each unit the weights sit beside the neuron and synapse circuits that use them, a circuit's accumulation meets a threshold, and what leaves is an event. The network arrives converted and quantized and runs as one pass of sparse events, and no spiking neuron model over T is exposed, which is why the chip carries the event NPU word of the conventional bucket rather than a place among the neuromorphic families that follow. Conceptual figure drawn from BrainChip's documentation<d-cite key="brainchip-akida-techbrief"></d-cite>; no measured quantity is drawn.</figcaption>
</figure>
