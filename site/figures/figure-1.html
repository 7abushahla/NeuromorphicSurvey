  <figcaption><b>Figure 1:</b> A biological neuron and two abstractions of it, side by side. The cell integrates dendritic input as a continuous membrane potential over physical time \(\tau\) and emits action potentials. The ANN unit retains the weighted aggregation and a represented value \(a^l\), computed once per inference evaluation. That value is static within the evaluation, and it is a complete description of the unit's output at that input rather than a reduced one. The SNN unit retains a simplified persistent state \(u[t]\), an algorithmic step index \(t\), a threshold \(\theta\) with a reset, and a binary event \(z[t]\). The property strip records, for each abstraction, which of the four properties it retains and in what form. Section 3 (neuron and synapse dynamics) gives the update rule for the SNN unit.</figcaption>
</figure>
