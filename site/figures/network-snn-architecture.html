  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1440 820" role="img" aria-label="A network-level spiking neural network. General event packets, of which the binary spike is one case, enter a layered network through weighted and delayed synapses. Each neuron carries a state across algorithmic steps, compares it with a threshold, resets after firing, and emits output events that remain events until a decoder reads them at the SNN boundary. A lower strip shows one neuron in one algorithmic step. Conceptual illustration.">
<title>From input events to decoded output in a spiking neural network</title>
<desc>A general event can carry an address, timestamp, polarity or type, and an optional payload. Binary spikes are one special case. Events traverse weighted and delayed synapses into stateful neurons, which threshold and reset before emitting new events. Output remains an event stream until a decoder turns it into an application result. A neuron below threshold sends nothing, which does not by itself show that hardware skipped work.</desc>

  <figcaption><b>Figure 6:</b> Conceptual illustration of an SNN as a network rather than an isolated spiking unit. Edges transmit events and apply a synaptic weight \(w_{ij}\) and, where a model specifies one, a delay \(d_{ij}\). Each neuron carries a state \(u[t]\) across algorithmic steps, tests it against a threshold, and resets after emitting, and the output remains an event stream until a stated decoder reads it into a label, an estimate, or an action. A general event can carry an address, a time, a polarity or type, and an optional payload \(p\), and the bare binary spike \(z[t]\in\{0,1\}\) is one important special case. A neuron that stays below threshold sends nothing on its edges, which makes communication of only the events that occur possible, but that absence does not by itself establish that a given execution substrate skipped the corresponding work.</figcaption>
