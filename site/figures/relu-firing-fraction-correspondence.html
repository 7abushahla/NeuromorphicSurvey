<!-- Derived figure; every drawn value is computed from the staged update. Provenance of every drawn phrase and symbol. Section 8.1 opening paragraph of site/sec-08.html (Cao et al. 2015): for nonnegative activations an IF neuron's spike count over a time window approximates the ANN activation. Section 8.1.2 (relu-rate-correspondence, eq:if-recurrence, eq:telescoped, eq:summed-current, eq:rate-identity): the recurrence u[t] = u[t-1] + q[t] + b - z[t] theta with reset-by-subtraction, the spike count N(T), the firing fraction rho(T) = N(T)/T, the identity rho(T) = (1/theta)(sum_j w_j rho_j(T) + b) - epsilon(T) with epsilon(T) = (u[T] - u[0])/(T theta), exact at every finite T; epsilon(T) = O(1/T) in the interior regime; at the two edges the identity holds exactly, rho(T) = 0 for a drive that stays negative (8.1.2; a drive of exactly zero never crosses either, from u[0] = 0, which is why the panel says non-positive) and rho(T) = 1 for a drive that would require firing on every step. Section 8.1.3: direct current injection, a constant drive held fixed for the whole horizon. Section 8.1.4: the per-layer scale lambda, the threshold set to it, theta = lambda. Section 8.1.7: each hidden layer carries a residual on the order of 1/T in the interior regime, exact at the two clipped edges. Section 3.2 and 3.5: the pre-reset candidate u-tilde[t], the post-reset state u[t], the spike z[t] in {0, 1}, the neuron fires when u-tilde[t] is at or above theta, reset-by-subtraction u[t] = u-tilde[t] - z[t] theta, no leak, u[0] = 0. Drawing conventions: panel boxes, header band, arrow markers, ReLU line and colors from Figure 27 (rate-code-quantizer.html); membrane trace with hollow circles at the pre-reset candidates and drops of theta from Figure 14 (reset-rule-comparison.html). Example drawn: theta = 1, no bias, u[0] = 0, constant drive 0.6 theta. Panel B over T = 8, pre-reset 0.60 1.20 0.80 1.40 1.00 0.60 1.20 0.80, spikes 0 1 0 1 1 0 1 0, post-reset 0.60 0.20 0.80 0.40 0 0.60 0.20 0.80, N(8) = 4, rho(8) = 0.5, u[8] = 0.8 theta, epsilon(8) = 0.1. Panel C for T = 1 to 20, N(T) = floor(0.6 T) = 0 1 1 2 3 3 4 4 5 6 6 7 7 8 9 9 10 10 11 12, rho(T) = N(T)/T, epsilon(T) = u[T]/T, rho(T) + epsilon(T) = 0.6 at every T, rho(T) at or above 0.6 - 1/T for every T from 2, residual zero at T = 5, 10, 15, 20. -->
<svg viewBox="0 0 1200 500" role="img" aria-labelledby="f25-title f25-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f25-title">The ReLU-to-firing-fraction correspondence for one unit, from the trained network's ReLU activation through its integrate-and-fire twin over T steps to the exact identity whose residual shrinks as the horizon grows</title>
  <desc id="f25-desc">Three panels read left to right and joined by arrows. ANN unit, a schematic with three inputs a1, a2, a3 weighted by w1, w2, w3 and a bias b entering a summation, then a ReLU block, then the output a equals ReLU of the weighted sum plus b; a small plot of output against input shows the ReLU line, zero for a non-positive input and slope one above, lighter above the scale λ, with one pre-activation marked at 0.6 λ and its output a equals 0.6 λ on the line. Its IF twin over T steps, the same schematic with spike-train inputs z1, z2, z3, the drive q of t equals the weighted sum of the presynaptic spikes, and a block reading IF, reset-by-subtraction, θ = λ; the membrane trace is computed for a constant drive of 0.6 θ over T = 8 steps, with pre-reset candidates 0.6, 1.2, 0.8, 1.4, 1.0, 0.6, 1.2, 0.8 in units of θ, spikes at t = 2, 4, 5 and 7 shown as red marks in a raster of eight slots, a drop of θ after each, post-reset states 0.6, 0.2, 0.8, 0.4, 0, 0.6, 0.2, 0.8, and the text N(8) = 4 spikes in T = 8 steps, ρ(8) = N(8)/T = 0.5, and u[8] = 0.8 θ, so ε(8) = u[8]/(8 θ) = 0.1, with the residual charge marked at the end of the trace. The identity holds at every T; the residual shrinks, with the identity written as ρ(T) = (1/θ)(Σj wj ρj(T) + b) − ε(T) and ε(T) = (u[T] − u[0])/(T θ), and beneath it the firing fraction plotted against the horizon T from 1 to 20, values 0, 0.500, 0.333, 0.500, 0.600, 0.500, 0.571, 0.500, 0.556, 0.600, 0.545, 0.583, 0.538, 0.571, 0.600, 0.563, 0.588, 0.556, 0.579, 0.600, as blue dots joined by a thin line; a green line at 0.6 labeled the ReLU value over θ, a dashed gray curve 0.6 minus 1/T labeled 1/T envelope on or below every point, the T = 8 point ringed with its gap to the green line bracketed and labeled ε(8) = 0.1, and two flat gray lines at 1 and 0 for a drive at or above θ on every step and a non-positive drive, where the fraction is exact at every T. A bottom line reads that the identity is exact at every finite horizon and only the residual shrinks, on the order of 1/T inside the interior regime and not at all at the two edges. Derived figure; every drawn value is computed from the update.</desc>

<figcaption><b>Figure 25:</b> The correspondence Section 8.1.2 derives, drawn for one unit with the layer and unit indices dropped. Left, the trained network's ReLU unit, its affine pre-activation and its output, marked at a pre-activation of \(0.6\,\lambda\) in the scale parameter mapping fixes (Section 8.1.4). Middle, the same unit mapped to an integrate-and-fire neuron with reset-by-subtraction and threshold \(\theta=\lambda\), computed from the staged update of Section 3.2 under a constant drive of \(0.6\,\theta\), the direct-injection case of Section 8.1.3, for \(T=8\) steps; the membrane crosses threshold four times, so \(N(8)=4\) and the firing fraction is \(\rho(8)=0.5\), and the charge still on the membrane at the end, \(0.8\,\theta\), is the residual \(\epsilon(8)=0.1\) that closes the identity, \(0.5=0.6-0.1\). Right, the identity itself, with the firing fraction plotted against the horizon for \(T=1\) to \(20\); it climbs toward \(0.6\) inside a \(1/T\) envelope and touches it whenever the residual is zero, while a unit whose drive stays non-positive, or reaches the threshold on every step, sits on \(0\) or \(1\) exactly at every \(T\). The identity holds at every finite horizon; only the residual shrinks. Figure 27 reads the same map at one fixed \(T\) across the input axis, as a quantizer. Derived figure; every drawn value is computed from the update.</figcaption>
