<svg viewBox="0 0 1200 522" role="img" aria-labelledby="f24-title f24-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="20">
  <title id="f24-title">The classical ANN-to-SNN conversion pipeline, the trained network and its five stages left to right, each with the assumption it relies on and the contract field it fixes</title>
  <desc id="f24-desc">A row of six boxes read left to right and joined by arrows, the trained network and the five stages of the pipeline. Trained ANN, a conventional ReLU network trained with backpropagation. Normalization, which folds batch normalization, replaces max pooling, and rescales residual branches. Parameter mapping, which estimates a calibration constant for every layer and sets thresholds and rescaled weights with biases unchanged. Encoding, which injects the input tensor as a constant per-pixel current for the whole horizon. Temporal execution, which runs T steps of the staged update with reset-by-subtraction. Readout, which accumulates the final layer's membrane potential without resetting it and divides by T. A bracket under normalization and parameter mapping reads from the trained network to the mapped network, and a bracket under encoding, temporal execution, and readout reads for a finite horizon T. A green band lists the Section 8.1.1 assumption each box relies on, feedforward with zero delay for the trained ANN and for readout, fixed running statistics for normalization, bounded per-layer activations for parameter mapping, and bounded synaptic drive for encoding and temporal execution. A blue band lists the Table 22 contract field each box fixes, field 9 connectivity for the trained ANN, field 1 network graph and supported operators for normalization, field 4 threshold and reset semantics for parameter mapping, field 6 input encoder for encoding, field 8 time model and termination condition for temporal execution, and field 6 output decoder for readout. Conceptual figure; no measured quantity is drawn.</desc>

    <text x="306" y="102" text-anchor="middle" fill="#4a5560" font-size="16">fold batch<tspan x="306" dy="19">normalization,</tspan><tspan x="306" dy="19">replace max</tspan><tspan x="306" dy="19">pooling, rescale</tspan><tspan x="306" dy="19">residual branches</tspan></text>

  </g>

  <text id="f24-relies-norm" x="306" y="291" text-anchor="middle" fill="#2a7f62" font-size="16"><tspan font-weight="700">Third</tspan><tspan x="306" dy="19">batch normalization</tspan><tspan x="306" dy="19">uses fixed</tspan><tspan x="306" dy="19">running statistics</tspan></text>
  <text id="f24-relies-map" x="502" y="291" text-anchor="middle" fill="#2a7f62" font-size="16"><tspan font-weight="700">First</tspan><tspan x="502" dy="19">every target</tspan><tspan x="502" dy="19">activation is</tspan><tspan x="502" dy="19">bounded by a finite</tspan><tspan x="502" dy="19">per-layer value on</tspan><tspan x="502" dy="19">the calibration data</tspan></text>
  <text id="f24-relies-encode" x="698" y="291" text-anchor="middle" fill="#2a7f62" font-size="16"><tspan font-weight="700">Fifth</tspan><tspan x="698" dy="19">the per-step synaptic</tspan><tspan x="698" dy="19">drive into every</tspan><tspan x="698" dy="19">unit is bounded</tspan></text>
  <text id="f24-relies-exec" x="894" y="291" text-anchor="middle" fill="#2a7f62" font-size="16"><tspan font-weight="700">Fifth</tspan><tspan x="894" dy="19">bounded drive,</tspan><tspan x="894" dy="19">so the membrane</tspan><tspan x="894" dy="19">potential stays</tspan><tspan x="894" dy="19">within a fixed range</tspan><tspan x="894" dy="19">independent of <tspan font-style="italic">T</tspan></tspan></text>
