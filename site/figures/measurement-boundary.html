<!-- Conceptual figure; no measured quantity is drawn. The six boundary names and every Included and Excluded phrase are the cells of Table 28 (id table-measurement-boundaries, Section 12.2); the Modeled box is drawn with a dashed outline and the Physical box with a solid one, following 12.2's definitions of the two. -->
<svg viewBox="0 0 1100 600" role="img" aria-labelledby="f29-title f29-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="16">
  <title id="f29-title">Four nested measurement boundaries from the chip to the decision, each adding a cost the inner one excludes, beside the modeled and physical boundaries whose outline marks whether fabricated silicon executed</title>
  <desc id="f29-desc">Four rounded rectangles nested one inside the next, read from the outside in. The outermost is labeled Sensor-to-decision, included physical sensor acquisition through to a decision or actuation signal, no host-side frame accumulation inserted, excluded any offline, pre-recorded, or frame-accumulated substitute for the live sensor path. Inside it, Host-inclusive, included board plus a driving host&#x27;s own encode, decode, or streaming overhead, excluded nothing upstream of the host. Inside that, Board-level, included chip plus board-mounted peripherals, memory, and I/O controllers, excluded a separate driving host machine. Innermost, Chip-only, included neurocore or die compute and its own energy or latency, excluded host input and output traffic, off-chip memory, board peripherals. To the right stand two boxes. Modeled, drawn with a dashed outline, included RTL synthesis, cycle-accurate simulation, or an analytical or SynOps estimate, excluded any fabricated silicon execution. Physical, drawn with a solid outline, included a fabricated device measured directly, without further decomposition into the boundaries above, excluded a separate board or host layer, because none surrounds the bench measurement. Conceptual figure; no measured quantity is drawn.</desc>
  <text id="f29-label-rings" x="30" y="26" font-size="14" fill="#8a94a0" letter-spacing="1.2">CHIP-ONLY TO SENSOR-TO-DECISION</text>
  <text id="f29-label-legend" x="730" y="26" font-size="14" fill="#8a94a0" letter-spacing="1.2">MODELED AND PHYSICAL</text>
  <g id="f29-sensor" class="f29-ring"><rect x="30" y="40" width="670" height="536" rx="8" fill="#ffffff" stroke="#8a94a0" stroke-width="1.8"/><text x="46" y="69" font-size="20" font-weight="700" fill="#2b3440">Sensor-to-decision</text><text x="46" y="94" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> Physical sensor acquisition through to a decision or actuation</text><text x="46" y="114" font-size="16" fill="#2b3440">signal, no host-side frame accumulation inserted</text><text x="46" y="134" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> Any offline, pre-recorded, or frame-accumulated substitute for the</text><text x="46" y="154" font-size="16" fill="#4A5560">live sensor path</text></g>
  <g id="f29-host" class="f29-ring"><rect x="46" y="172" width="638" height="388" rx="8" fill="#f6f7f9" stroke="#8a94a0" stroke-width="1.8"/><text x="62" y="201" font-size="20" font-weight="700" fill="#2b3440">Host-inclusive</text><text x="62" y="226" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> Board plus a driving host&#x27;s own encode, decode, or streaming</text><text x="62" y="246" font-size="16" fill="#2b3440">overhead</text><text x="62" y="266" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> Nothing upstream of the host</text></g>
  <g id="f29-board" class="f29-ring"><rect x="62" y="284" width="606" height="260" rx="8" fill="#eef0f3" stroke="#8a94a0" stroke-width="1.8"/><text x="78" y="313" font-size="20" font-weight="700" fill="#2b3440">Board-level</text><text x="78" y="338" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> Chip plus board-mounted peripherals, memory, and I/O</text><text x="78" y="358" font-size="16" fill="#2b3440">controllers</text><text x="78" y="378" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> A separate driving host machine</text></g>
  <g id="f29-chip" class="f29-ring"><rect x="78" y="396" width="574" height="132" rx="8" fill="#e5e8ec" stroke="#8a94a0" stroke-width="1.8"/><text x="94" y="425" font-size="20" font-weight="700" fill="#2b3440">Chip-only</text><text x="94" y="450" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> Neurocore or die compute and its own energy or</text><text x="94" y="470" font-size="16" fill="#2b3440">latency</text><text x="94" y="490" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> Host input and output traffic, off-chip memory, board</text><text x="94" y="510" font-size="16" fill="#4A5560">peripherals</text></g>
  <g id="f29-modeled" class="f29-box"><rect x="730" y="40" width="340" height="220" rx="8" fill="#ffffff" stroke="#8a94a0" stroke-width="1.8" stroke-dasharray="8 6"/><text x="746" y="69" font-size="20" font-weight="700" fill="#2b3440">Modeled</text><text x="746" y="94" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> RTL synthesis,</text><text x="746" y="114" font-size="16" fill="#2b3440">cycle-accurate simulation, or an</text><text x="746" y="134" font-size="16" fill="#2b3440">analytical or SynOps estimate</text><text x="746" y="154" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> Any fabricated silicon</text><text x="746" y="174" font-size="16" fill="#4A5560">execution</text></g>
  <g id="f29-physical" class="f29-box"><rect x="730" y="315" width="340" height="261" rx="8" fill="#f6f7f9" stroke="#8a94a0" stroke-width="1.8"/><text x="746" y="344" font-size="20" font-weight="700" fill="#2b3440">Physical</text><text x="746" y="369" font-size="16" fill="#2b3440"><tspan font-weight="700">Included</tspan> A fabricated device</text><text x="746" y="389" font-size="16" fill="#2b3440">measured directly, without further</text><text x="746" y="409" font-size="16" fill="#2b3440">decomposition into the boundaries</text><text x="746" y="429" font-size="16" fill="#2b3440">above</text><text x="746" y="449" font-size="16" fill="#4A5560"><tspan font-weight="700">Excluded</tspan> A separate board or host</text><text x="746" y="469" font-size="16" fill="#4A5560">layer, because none surrounds the</text><text x="746" y="489" font-size="16" fill="#4A5560">bench measurement</text></g>
</svg>
<figcaption><b>Figure 29:</b> The measurement boundaries of Section 12.2, four of the six drawn as nested regions and the other two, modeled and physical, drawn beside them. A number reported at an outer boundary includes every cost inside it, so two latency or energy figures compare only when their boundaries match, and the two boundaries drawn beside them, modeled with a dashed outline and physical with a solid one, separate a number computed from a model from one measured on a fabricated device. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
