<figure class="pfig l-body" id="figure-16">
  <div style="max-width: 720px; margin: 0 auto;">
    <svg viewBox="0 0 1200 1180" role="img" aria-labelledby="f16title f16desc">
      <title id="f16title">Neural codes compared by represented variable, encoder, transmitted object, decoder, horizon, precision, and cost</title>
      <desc id="f16desc">Conceptual illustration. Eight rows compare rate or count, time to first spike, phase, burst, population, sigma-delta, rank order, and direct current input. Each row states the represented variable and encoder, draws the transmitted object with its payload named, states the decoder, and lists the observation horizon, the precision mechanism, the spike cost, and the spatial cost. Direct current is separated because it is an input boundary convention rather than an internal neural code. No row claims an equal value or equal precision with another.</desc>
      <defs>
        <marker id="f16arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker>
      </defs>

      <text x="46" y="43" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">A neural code specifies what an event pattern means</text>
      <text x="46" y="72" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">Represented variable, encoder, transmitted object, decoder, horizon, precision, and cost are stated per mechanism, not per benchmark.</text>

      <rect x="42" y="100" width="1116" height="58" rx="8" fill="#d5dbe2" stroke="#000" stroke-width="2.2"/>
      <text x="62" y="136" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Not a common-cost ranking. No row carries a common value at a common precision, and each spends a different resource.</text>

      <rect x="42" y="186" width="1116" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <text x="62" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Code</text>
      <text x="250" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Represented variable, encoder</text>
      <text x="556" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Transmitted object</text>
      <text x="785" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Decoder</text>
      <text x="960" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Horizon and cost</text>
      
      <g class="f16-row">

        <rect x="42" y="256" width="196" height="98"  fill="#CFE2F3"/>

        <line x1="556" y1="318" x2="746" y2="318" stroke="#000" stroke-width="1.8"/><line x1="578" y1="318" x2="578" y2="278" stroke="#D63A2F" stroke-width="4.6"/><line x1="620" y1="318" x2="620" y2="291" stroke="#D63A2F" stroke-width="4.6"/><line x1="663" y1="318" x2="663" y2="276" stroke="#D63A2F" stroke-width="4.6"/><line x1="724" y1="318" x2="724" y2="285" stroke="#D63A2F" stroke-width="4.6"/>

      <g class="f16-row">

        <rect x="42" y="354" width="196" height="98"  fill="#FFDDA6"/>

        <text x="62" y="412" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">time to first spike, latency</text>

        <text x="651" y="440" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px" fill="#555">one timing event per neuron, the first is read</text>

        <text x="960" y="381" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#000">one spike, quantized to the tick</text><text x="960" y="404" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#333">floor set by <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">&#916;t</tspan></text><text x="960" y="427" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#333">one spike per neuron</text>

      </g>
      <g class="f16-row">
        <title>Phase coding assigns a known weight to each slot of a repeating cycle. The decoder sums the weights of the slots that carried a spike, so a shared phase reference and the weight schedule are part of the representation.</title>
        <rect x="42" y="452" width="1116" height="98"  fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="452" width="196" height="98"  fill="#CDEBCD"/>
        <text x="62" y="485" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Phase</text>
        <text x="62" y="510" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">weighted time slots</text>
        <text x="250" y="479" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">Scalar activation</text><text x="250" y="502" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#333">Encoder, spike phase in a <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">K</tspan>-step</text><text x="250" y="525" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#333">cycle with power-of-two weights</text>

        <text x="785" y="479" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">Weighted sum of</text><text x="785" y="502" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#333">active phases</text>

        <rect class="f16-band" x="42" y="452" width="1116" height="98"  fill="#D63A2F" opacity="0"/><rect x="42" y="452" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>
      <g class="f16-row">
        <title>Burst coding keeps a count-like meaning but allows several unit events in one algorithmic step when the residual potential is large. The neuron and runtime must define how that multiplicity is represented.</title>
        <rect x="42" y="550" width="1116" height="98"  fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="550" width="196" height="98"  fill="#F9D4EA"/>

        <text x="785" y="577" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">Count over the window,</text><text x="785" y="600" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#333">as in rate coding</text>
        <text x="960" y="577" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#000">fewer steps for an equal count</text><text x="960" y="600" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#333">same grid as rate coding</text><text x="960" y="623" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#333">same total spikes, denser</text>

      </g>
      <g class="f16-row">
        <title>Population coding distributes a value across several neurons. It is a spatial axis that combines with rate, temporal, or other codes, so its cost is paid in neurons rather than in steps.</title>
        <rect x="42" y="648" width="1116" height="98"  fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="648" width="196" height="98"  fill="#CFE2F3"/>
        <text x="62" y="681" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Population</text>

      <g class="f16-row">
        <title>Sigma-delta coding transmits a signed change in activation as a graded event payload and reconstructs the signal by a running sum. A binary event count is not equivalent to this payload-bearing channel.</title>
        <rect x="42" y="746" width="1116" height="98"  fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="746" width="196" height="98"  fill="#FFDDA6"/>

        <text x="651" y="832" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:13px" fill="#555">graded signed payload <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">p</tspan> per spike</text>
        <text x="785" y="773" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">Running-sum</text><text x="785" y="796" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#333">reconstruction</text>

      <g class="f16-row">
        <title>Rank order coding represents the relative firing order across a population, not an absolute magnitude. The decoder must preserve the ordering, and the original amplitude cannot be recovered from order alone.</title>
        <rect x="42" y="844" width="1116" height="98"  fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
