     neuron circuit, after deng-2025-edgesnn's architecture comparison.
     Rows are the first question of Section 5.2, where the weight sits relative to the arithmetic, the axis of
     Figure 21 turned on end. The axis name from vonneumann1945-edvac (the memory, the control and the arithmetic
     organ) and backus1978-von-neumann-style (the word-at-a-time style and the bottleneck), as in that figure's
     provenance. Columns are the second question, a static function evaluated once per input against a system whose
     state persists across time.
     Cell contents are Table 11's own entries and its subsection pointers, upper left Section 5.3, upper right
     Sections 5.3 and 5.4, lower left Section 5.5, lower right Section 5.6.
     The mini icons quote Figure 21's panels, (a) and (b) upper left, (a) with a stepped loop upper right, one
     near-memory cell lower left, an array of near-memory cells lower right. Bucket hues from data/target-kinds.json,
     conventional blue for the three conventional cells, the neuromorphic warm tint for the lower right cell.
     The two dashed arrows carry Section 5's two statements about the crossings, the state over T that the event NPU
     does not carry, and the simulator as the second crossing Figure 4 draws.

<figcaption><b>Figure 23:</b> The two questions Table 11 crosses, drawn in the vocabulary of Figure 21. Down the side sits where the weight sits relative to the arithmetic that uses it, von Neumann above<d-cite key="vonneumann1945-edvac"></d-cite><d-cite key="backus1978-von-neumann-style"></d-cite> and non-von Neumann below; across the top sits what the silicon computes, a static function once per input or state carried across <i>T</i>. The event NPU has left von Neumann without carrying state over <i>T</i>, one cell short of neuromorphic silicon, and a simulator is its mirror image, a machine whose memory sits apart stepping the equations of one whose memory does not. The third question, how time passes, sorts the families inside the lower right cell and is left to the table in Section 5.6. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
