<figcaption><b>Figure 20:</b> Two questions sort every deployment target of this section. Across, where the weight sits relative to the arithmetic that uses it, which is the axis of Figure 18 from the memory apart from the arithmetic<d-cite key="vonneumann1945-edvac"></d-cite><d-cite key="backus1978-von-neumann-style"></d-cite> to the memory beside or inside the neuron. Down, whether the silicon evaluates a static function once per input or carries state across time. Each cell holds one subsection's targets, so the chip words of Table 10 fall out as four groups rather than a list. The event NPU is the one chip word that has left von Neumann without carrying state over T, and a simulator is its mirror image, a machine whose memory sits apart stepping the equations of one whose memory does not. The third question, how time passes, sorts the families inside the lower right cell and is left to the table in Section 5.6. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
