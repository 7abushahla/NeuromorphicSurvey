<figure class="pfig l-body" id="figure-2">
  <div style="max-width: 1100px; margin: 0 auto;"><svg viewBox="0 0 1440 820" role="img" aria-label="A network-level spiking neural network. General event packets enter a layered network through weighted, delayed synapses. Each neuron retains state, compares it with a threshold, resets after firing, and emits output events that are decoded at an application boundary.">
<title>From input events to decoded output in a spiking neural network</title>
<desc>A general event can carry an address, timestamp, polarity or type, and an optional graded payload. Binary spikes are one special case. Events traverse weighted and delayed synapses into stateful neurons, which threshold and reset before emitting new events. A decoder turns output activity into an application result.</desc>
<defs>
  <marker id="f2arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker>
  <marker id="f2arrred" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D63A2F"/></marker>
</defs>

<text x="720" y="40" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">A spiking neural network carries events and retains state</text>
<text x="720" y="70" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px" fill="#555">Communication is event based. Computation remains stateful between events.</text>

  <div class="fig-hint">Hover the event, synapse, neuron, decoder, or operating cycle for the semantic distinction it carries.</div>
  <figcaption><b>Figure 2:</b> A network-level SNN routes event packets through weighted and potentially delayed synapses while each neuron maintains a state across algorithmic steps. Thresholding and reset transform local state into new events, and a decoder converts the resulting activity into an application-level output. Binary spikes are a common special case of this broader event interface.</figcaption>
