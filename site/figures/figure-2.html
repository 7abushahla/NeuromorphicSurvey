<text x="565" y="552" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Discarded by the artificial neuron, restored by the spiking neuron</text>
<g class="f2-hot"><title>Time is the axis the spiking neuron runs along. Reintroducing it is what turns a single evaluation into a simulation over a horizon.</title>
<rect x="30" y="570" width="340" height="96" rx="10" fill="#FFDDA6" stroke="#C9A34E" stroke-width="2.4"/>
<rect class="f2-hl" x="30" y="570" width="340" height="96" rx="10" fill="#D63A2F" opacity="0"/>
<circle cx="66" cy="599" r="15" fill="#fff" stroke="#D63A2F" stroke-width="2.2"/>
<text x="66" y="606" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#D63A2F">1</text>
<text x="96" y="606" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Time</text>
<text x="50" y="630" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">One shot evaluation. No horizon <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">T</tspan></text>
<text x="50" y="652" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">over which input arrives.</text>
<rect x="30" y="570" width="340" height="96" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>A spike has no magnitude to tune. Restoring discreteness is what makes the arithmetic accumulation rather than multiplication.</title>
<rect x="395" y="570" width="340" height="96" rx="10" fill="#FFDDA6" stroke="#C9A34E" stroke-width="2.4"/>
<rect class="f2-hl" x="395" y="570" width="340" height="96" rx="10" fill="#D63A2F" opacity="0"/>
<circle cx="431" cy="599" r="15" fill="#fff" stroke="#D63A2F" stroke-width="2.2"/>
<text x="431" y="606" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#D63A2F">2</text>
<text x="461" y="606" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Discrete events</text>
<text x="415" y="630" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">A continuous real number, not</text>
<text x="415" y="652" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">an all or nothing event.</text>
<rect x="395" y="570" width="340" height="96" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>State is what lets a neuron answer with something other than a function of the present input. The membrane potential is that memory.</title>
<rect x="760" y="570" width="340" height="96" rx="10" fill="#FFDDA6" stroke="#C9A34E" stroke-width="2.4"/>
<rect class="f2-hl" x="760" y="570" width="340" height="96" rx="10" fill="#D63A2F" opacity="0"/>
<circle cx="796" cy="599" r="15" fill="#fff" stroke="#D63A2F" stroke-width="2.2"/>
<text x="796" y="606" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#D63A2F">3</text>
<text x="826" y="606" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Membrane state</text>
<text x="780" y="630" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">No potential is carried between</text>
<text x="780" y="652" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#333">steps, so nothing accumulates.</text>
<rect x="760" y="570" width="340" height="96" fill="#000" opacity="0" pointer-events="all"/></g>

<!-- hover regions over the drawings -->
<g class="f2-hot"><title>Dendrites collect input from many upstream cells. Each arriving spike nudges the potential held in the soma.</title>
<rect class="f2-hl" x="6" y="64" width="112" height="230" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="6" y="64" width="112" height="230" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>The soma holds the membrane potential, a state variable that persists between inputs. The artificial neuron has no equivalent of it.</title>
<rect class="f2-hl" x="94" y="144" width="96" height="84" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="94" y="144" width="96" height="84" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>Once the threshold is crossed, the action potential travels down the axon at full amplitude. Its size carries no information, only its timing does.</title>
<rect class="f2-hl" x="200" y="150" width="236" height="80" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="200" y="150" width="236" height="80" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>At the synapse the arriving spike acts on the next cell. Communication between neurons is an event, not a continuous number.</title>
<rect class="f2-hl" x="440" y="144" width="110" height="96" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="440" y="144" width="110" height="96" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>The cell fires only once the potential reaches the threshold. Below it the neuron integrates silently and emits nothing at all.</title>
<rect class="f2-hl" x="64" y="346" width="424" height="26" fill="#D63A2F" opacity="0"/>
<rect x="64" y="346" width="424" height="26" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>Every tick is one identical spike. The information sits in when the ticks occur and how many of them there are, never in how large they are.</title>
<rect class="f2-hl" x="150" y="442" width="300" height="52" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="150" y="442" width="300" height="52" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>The weighted sum is the one piece of the biological cell the artificial unit keeps. Every input is consumed at once, with no notion of arrival time.</title>
<rect class="f2-hl" x="722" y="152" width="76" height="76" rx="38" fill="#D63A2F" opacity="0"/>
<rect x="722" y="152" width="76" height="76" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>The nonlinearity is static, meaning it has no memory. The same sum always produces the same output, whatever came before it.</title>
<rect class="f2-hl" x="836" y="146" width="116" height="88" rx="10" fill="#D63A2F" opacity="0"/>
<rect x="836" y="146" width="116" height="88" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>The output is one continuous real number. Nothing about it is discrete and nothing persists into the next evaluation.</title>
<rect class="f2-hl" x="996" y="168" width="112" height="46" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="996" y="168" width="112" height="46" fill="#000" opacity="0" pointer-events="all"/></g>
<g class="f2-hot"><title>There is no horizon to run the artificial neuron over. A single forward pass produces the answer, so time never enters the model.</title>
<rect class="f2-hl" x="640" y="456" width="420" height="48" rx="8" fill="#D63A2F" opacity="0"/>
<rect x="640" y="456" width="420" height="48" fill="#000" opacity="0" pointer-events="all"/></g>
</svg></div>
  <div class="fig-hint">Hover any part of either neuron for what it contributes, and any numbered box for what its loss costs.</div>
  <figcaption><b>Figure 2:</b> A biological neuron and its artificial abstraction, side by side. The cell integrates dendritic input in the soma until the membrane potential crosses a threshold, then emits identical spikes whose timing carries the information, whereas the artificial neuron keeps only a weighted sum and a static nonlinearity and returns one continuous real number. The three quantities the abstraction drops, time, discrete events, and membrane state, are exactly the three that the spiking neuron models of the next subsection restore.</figcaption>
</figure>
