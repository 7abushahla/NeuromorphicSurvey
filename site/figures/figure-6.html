"/><text x="338" y="740" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">0</text><text x="750" y="748" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:24px" fill="#000">wall-clock time</text><text x="600" y="788" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#D63A2F">Equal <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">T</tspan> does not mean equal time.</text><text x="600" y="816" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#6f7a85">All three rows share one time origin. Horizontal extents are schematic.</text><g class="f6-hot"><title>A blocking barrier holds every core until the slowest one has finished its update, so a tick lasts as long as its busiest core. The wall-clock length of a tick therefore grows with spike traffic.</title><rect class="f6-band" x="330" y="50" width="832" height="200" fill="#D63A2F" opacity="0"/><rect x="330" y="50" width="832" height="200" fill="#000" opacity="0" pointer-events="all"/></g><g class="f6-hot"><title>One event crosses all nine convolutional layers of Speck in 3.36 microseconds, roughly 0.37 microseconds per layer. That delay is a property of the logic itself, not a multiple of any chosen simulation step.</title><rect class="f6-band" x="330" y="276" width="252" height="194" fill="#D63A2F" opacity="0"/><rect x="330" y="276" width="252" height="194" fill="#000" opacity="0" pointer-events="all"/></g><g class="f6-hot"><title>A num_timesteps setting survives only as far as the point where a discrete raster is turned into individually timestamped events. The asynchronous fabric never sees it.</title><rect class="f6-band" x="586" y="276" width="576" height="194" fill="#D63A2F" opacity="0"/><rect x="586" y="276" width="576" height="194" fill="#000" opacity="0" pointer-events="all"/></g><g class="f6-hot"><title>Neuron circuits run roughly 1,000 times faster than the biological time constants they stand for, a physical property of the capacitances and bias currents rather than a digital speedup.</title><rect class="f6-band" x="330" y="500" width="832" height="180" fill="#D63A2F" opacity="0"/><rect x="330" y="500" width="832" height="180" fill="#000" opacity="0" pointer-events="all"/></g></svg></div>
  <div class="fig-hint">Hover a panel to see what sets its timing.</div>
  <figcaption><b>Figure 6:</b> Three hardware time models drawn against one common wall-clock axis. Under a synchronous global tick a blocking barrier holds every core until the slowest one finishes, so a tick has no fixed wall-clock duration and stretches with spike traffic. Under asynchronous event-driven execution there is no clock at all, and a single event crosses nine layers of Speck in 3.36 &#181;s no matter how many timesteps the software believed it was running. Analog continuous dynamics are physically accelerated and merely sampled by a digital control frame. A latency result stated in timesteps therefore does not carry across these three platforms unchanged.</figcaption>
</figure>
