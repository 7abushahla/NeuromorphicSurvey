<figure class="pfig l-body" id="figure-15">
  <div style="max-width: 720px; margin: 0 auto;">
    <svg viewBox="0 0 1200 1180" role="img" aria-labelledby="f15title f15desc">
      <title id="f15title">Neural codes differ in the variable carried and the contract they require</title>
      <desc id="f15desc">Eight rows compare rate or count, time to first spike, phase, burst, population, sigma-delta, rank order, and direct current input. The rows identify the represented variable, a compact example, the usual readout, and the operational constraint that must be preserved. Direct current is separated because it is an input boundary convention rather than an internal neural code.</desc>
      <defs>
        <marker id="f15arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker>
      </defs>

      <text x="46" y="43" style="font-family:Arial,Helvetica,sans-serif;font-size:29px;font-weight:700" fill="#000">A neural code specifies what an event pattern means</text>
      <text x="46" y="72" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">These are semantic distinctions. Precision, latency, activity, and energy depend on the chosen encoder, horizon, data, and execution path.</text>

      <rect x="42" y="100" width="1116" height="58" rx="8" fill="#d5dbe2" stroke="#000" stroke-width="2.2"/>
      <text x="62" y="136" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">The comparison is not a common-cost ranking. A code changes the represented variable and therefore changes what a platform and decoder must preserve.</text>

      <rect x="42" y="186" width="1116" height="56" rx="8" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <text x="62" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Code</text>
      <text x="265" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">What carries the information</text>
      <text x="552" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Compact pattern</text>
      <text x="804" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Typical readout</text>
      <text x="990" y="220" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Required contract</text>

      <!-- Rate and count -->
      <g class="f15-row">
        <title>Rate or count coding represents magnitude by the number of unit events in a stated observation window. The window length, threshold, reset rule, and decoder define the represented value.</title>
        <rect x="42" y="256" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="256" width="196" height="98" fill="#CFE2F3"/>
        <text x="62" y="289" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Rate or count</text>
        <text x="62" y="316" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">unit events over a window</text>
        <text x="265" y="287" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Magnitude in a spike count</text>
        <text x="265" y="316" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">or its count divided by time</text>
        <line x1="556" y1="318" x2="746" y2="318" stroke="#000" stroke-width="1.8"/>
        <g stroke="#D63A2F" stroke-width="4.6"><line x1="578" y1="318" x2="578" y2="278"/><line x1="620" y1="318" x2="620" y2="291"/><line x1="663" y1="318" x2="663" y2="276"/><line x1="724" y1="318" x2="724" y2="285"/></g>
        <text x="651" y="342" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">count in a stated T-step window</text>
        <text x="804" y="287" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Count or rate estimate</text>
        <text x="804" y="316" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">over the same window</text>
        <text x="990" y="287" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">T, reset, threshold</text>
        <text x="990" y="316" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">and binary event rule</text>
        <rect class="f15-band" x="42" y="256" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="256" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- TTFS -->
      <g class="f15-row">
        <title>Time-to-first-spike coding represents magnitude by a first-event time. Timing resolution and deadline are part of the code because they determine which latency distinctions survive execution.</title>
        <rect x="42" y="354" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="354" width="196" height="98" fill="#FFDDA6"/>
        <text x="62" y="387" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Time to first spike</text>
        <text x="62" y="414" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">TTFS or latency code</text>
        <text x="265" y="385" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">First-event time</text>
        <text x="265" y="414" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">earlier or later encodes value</text>
        <line x1="556" y1="416" x2="746" y2="416" stroke="#000" stroke-width="1.8"/>
        <line x1="598" y1="416" x2="598" y2="368" stroke="#D63A2F" stroke-width="4.6"/>
        <line x1="662" y1="416" x2="662" y2="390" stroke="#D63A2F" stroke-width="2.2" stroke-dasharray="5 4"/>
        <text x="651" y="440" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">first event is read</text>
        <text x="804" y="385" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">First arrival time</text>
        <text x="804" y="414" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">or earliest output class</text>
        <text x="990" y="385" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Time grid, deadline</text>
        <text x="990" y="414" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">must preserve order</text>
        <rect class="f15-band" x="42" y="354" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="354" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Phase -->
      <g class="f15-row">
        <title>Phase coding assigns a known weight to each temporal slot. The decoder sums those slot weights, so a shared phase reference and the weight schedule are part of the representation.</title>
        <rect x="42" y="452" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="452" width="196" height="98" fill="#CDEBCD"/>
        <text x="62" y="485" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Phase</text>
        <text x="62" y="512" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">weighted time slots</text>
        <text x="265" y="483" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Event position with known weight</text>
        <text x="265" y="512" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">within a shared phase cycle</text>
        <line x1="556" y1="514" x2="746" y2="514" stroke="#000" stroke-width="1.8"/>
        <g stroke="#000" stroke-width="1.2"><line x1="584" y1="504" x2="584" y2="524"/><line x1="626" y1="504" x2="626" y2="524"/><line x1="668" y1="504" x2="668" y2="524"/><line x1="710" y1="504" x2="710" y2="524"/></g>
        <line x1="584" y1="514" x2="584" y2="468" stroke="#D63A2F" stroke-width="4.6"/>
        <text x="584" y="465" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#555">4</text><text x="626" y="490" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#555">2</text><text x="668" y="504" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:14px" fill="#555">1</text>
        <text x="804" y="483" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Weighted slot sum</text>
        <text x="804" y="512" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">according to phase schedule</text>
        <text x="990" y="483" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Shared time reference</text>
        <text x="990" y="512" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">and slot-weight rule</text>
        <rect class="f15-band" x="42" y="452" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="452" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Burst -->
      <g class="f15-row">
        <title>Burst coding preserves a count-like meaning but allows several unit events in a short interval or one algorithmic step. The neuron and runtime must define how such multiplicity is represented.</title>
        <rect x="42" y="550" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="550" width="196" height="98" fill="#F9D4EA"/>
        <text x="62" y="583" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Burst</text>
        <text x="62" y="610" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">count packed in time</text>
        <text x="265" y="581" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Multiplicity of unit events</text>
        <text x="265" y="610" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">inside a short interval</text>
        <line x1="556" y1="612" x2="746" y2="612" stroke="#000" stroke-width="1.8"/>
        <g stroke="#D63A2F" stroke-width="4.6"><line x1="600" y1="612" x2="600" y2="568"/><line x1="610" y1="612" x2="610" y2="575"/><line x1="620" y1="612" x2="620" y2="568"/><line x1="630" y1="612" x2="630" y2="581"/><line x1="692" y1="612" x2="692" y2="573"/></g>
        <text x="804" y="581" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Count over a stated interval</text>
        <text x="804" y="610" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">with defined within-step behavior</text>
        <text x="990" y="581" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Multi-event rule</text>
        <text x="990" y="610" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">and time granularity</text>
        <rect class="f15-band" x="42" y="550" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="550" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Population -->
      <g class="f15-row">
        <title>Population coding distributes information across several neurons. It is a spatial axis that can be combined with rate, temporal, or other event codes, so its resource use is not directly comparable with a single-neuron temporal code.</title>
        <rect x="42" y="648" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="648" width="196" height="98" fill="#CFE2F3"/>
        <text x="62" y="681" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Population</text>
        <text x="62" y="708" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">spatial multiplexing axis</text>
        <text x="265" y="679" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Joint activity across neurons</text>
        <text x="265" y="708" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">for example, tuning-curve responses</text>
        <g fill="#CDEBCD" stroke="#000" stroke-width="1.8"><circle cx="583" cy="683" r="15"/><circle cx="626" cy="683" r="15"/><circle cx="669" cy="683" r="15"/><circle cx="712" cy="683" r="15"/></g>
        <g stroke="#D63A2F" stroke-width="4.2"><line x1="583" y1="716" x2="583" y2="700"/><line x1="669" y1="716" x2="669" y2="694"/><line x1="712" y1="716" x2="712" y2="703"/></g>
        <text x="647" y="738" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">activity pattern across units</text>
        <text x="804" y="679" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Ensemble readout</text>
        <text x="804" y="708" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">not one neuron's rate alone</text>
        <text x="990" y="679" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Units and tuning rule</text>
        <text x="990" y="708" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">plus each unit's code</text>
        <rect class="f15-band" x="42" y="648" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="648" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Sigma delta -->
      <g class="f15-row">
        <title>Sigma-delta coding transmits a signed change in activation, often as a graded event payload, and reconstructs the signal by a running sum. A binary event count is not equivalent to this payload-bearing channel.</title>
        <rect x="42" y="746" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="746" width="196" height="98" fill="#FFDDA6"/>
        <text x="62" y="779" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Sigma-delta</text>
        <text x="62" y="806" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">graded signed changes</text>
        <text x="265" y="777" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Activation delta in an event payload</text>
        <text x="265" y="806" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">rather than a unit-event count</text>
        <line x1="556" y1="808" x2="746" y2="808" stroke="#000" stroke-width="1.8"/>
        <rect x="583" y="770" width="43" height="38" rx="4" fill="#FFDDA6" stroke="#000" stroke-width="1.8"/><text x="604" y="796" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">+3</text>
        <rect x="675" y="782" width="43" height="26" rx="4" fill="#CFE2F3" stroke="#000" stroke-width="1.8"/><text x="696" y="802" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700" fill="#000">−1</text>
        <text x="804" y="777" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Running reconstruction</text>
        <text x="804" y="806" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">of transmitted changes</text>
        <text x="990" y="777" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Payload, sign, state</text>
        <text x="990" y="806" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">and delta threshold</text>
        <rect class="f15-band" x="42" y="746" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="746" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Rank order -->
      <g class="f15-row">
        <title>Rank order coding represents the relative firing order across a population, not absolute magnitude. The decoder must preserve the ordering, and the code cannot reconstruct the original amplitude from order alone.</title>
        <rect x="42" y="844" width="1116" height="98" fill="#fff" stroke="#c9d2db" stroke-width="1.6"/>
        <rect x="42" y="844" width="196" height="98" fill="#CDEBCD"/>
        <text x="62" y="877" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Rank order</text>
        <text x="62" y="904" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">relative order, not amplitude</text>
        <text x="265" y="875" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Permutation of first-event arrivals</text>
        <text x="265" y="904" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">across a population</text>
        <line x1="556" y1="906" x2="746" y2="906" stroke="#000" stroke-width="1.8"/>
        <g stroke="#D63A2F" stroke-width="4.6"><line x1="585" y1="906" x2="585" y2="862"/><line x1="645" y1="906" x2="645" y2="880"/><line x1="704" y1="906" x2="704" y2="872"/></g>
        <text x="585" y="853" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">1st</text><text x="645" y="873" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">3rd</text><text x="704" y="864" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">2nd</text>
        <text x="804" y="875" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Order-sensitive readout</text>
        <text x="804" y="904" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">such as rank-weighted integration</text>
        <text x="990" y="875" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Unit identity and order</text>
        <text x="990" y="904" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">amplitude is discarded</text>
        <rect class="f15-band" x="42" y="844" width="1116" height="98" fill="#D63A2F" opacity="0"/><rect x="42" y="844" width="1116" height="98" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <!-- Direct input -->
      <g class="f15-row">
        <title>Direct constant current is an input-boundary convention, not an internal neural code. A real-valued input drives the first layer at each step, so this boundary requires a real-valued input path and has no spike-train decoder.</title>
        <rect x="42" y="972" width="1116" height="126" rx="8" fill="#fff" stroke="#000" stroke-width="2.2"/>
        <rect x="42" y="972" width="196" height="126" rx="8" fill="#F9D4EA"/>
        <text x="62" y="1007" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Direct current</text>
        <text x="62" y="1034" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">input boundary convention</text>
        <text x="62" y="1060" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700" fill="#D63A2F">not an internal spike code</text>
        <text x="265" y="1005" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">Real-valued input applied to first layer</text>
        <text x="265" y="1034" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">at each algorithmic step</text>
        <line x1="556" y1="1040" x2="746" y2="1040" stroke="#000" stroke-width="1.8"/>
        <path d="M564,1024 C585,1000 602,1065 625,1040 S667,1005 690,1040 S724,1062 742,1028" fill="none" stroke="#8fbfef" stroke-width="4.6"/>
        <text x="651" y="1070" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">continuous or fixed-point value</text>
        <text x="804" y="1005" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000">No input spike decoder</text>
        <text x="804" y="1034" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">the first layer receives a value</text>
        <text x="990" y="1005" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">Input format, first layer</text>
        <text x="990" y="1034" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">value accumulation path</text>
        <text x="265" y="1072" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Only subsequent layer outputs need be spiking.</text>
        <rect class="f15-band" x="42" y="972" width="1116" height="126" rx="8" fill="#D63A2F" opacity="0"/><rect x="42" y="972" width="1116" height="126" fill="#000" opacity="0" pointer-events="all"/>
      </g>

      <text x="42" y="1142" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">A deployment report should name the code, its encoder and decoder, its timing interpretation, and the payload or state semantics carried across the chosen route.</text>
    </svg>
  </div>
  <div class="fig-hint">Hover a row to see the semantic field that distinguishes that representation.</div>
  <figcaption><b>Figure 15:</b> Neural codes differ in the variable that their event patterns represent and in the encoder, decoder, timing, payload, and state semantics that make that representation meaningful. Rate and burst codes use counts, TTFS and phase codes use timing, population coding uses joint spatial activity, sigma-delta coding uses graded changes, and rank-order coding uses relative arrival order. Direct constant-current input is shown separately because it is an input-boundary convention, not an internal spike code. These differences do not imply a universal precision, latency, activity, or energy ordering.</figcaption>
</figure>
