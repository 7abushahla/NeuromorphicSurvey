  <div class="fig-hint">Hover the shaded charge, the spike counts, or the input to see what each reset rule does with the charge above threshold.</div>
  <figcaption><b>Figure 4:</b> One input current, two reset rules. The same eight-step current drives an integrate-and-fire neuron under hard reset (middle) and under soft reset (bottom). Hard reset clamps the potential at every spike, so the charge above threshold, shaded in red, is destroyed, 1.60 \(V_{\text{th}}\) of it over this window. Soft reset subtracts the threshold instead, so the same excess carries into the next step and the neuron fires four times where hard reset fires twice. The discarded charge depends on the input rather than being zero mean, so the hard-reset rate estimate sits below the target activation and stays there as \(T\) grows, while the soft-reset gap is only the residual still held on the membrane and shrinks as \(1/T\).</figcaption>
</figure>
