<svg viewBox="0 0 1000 626" role="img" aria-labelledby="f30-title f30-desc" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" font-size="14">
  <title id="f30-title">The four boundaries between a framework and a device, and at each what is preserved, transformed, rejected, or unexercised, with one audited case at three of them</title>
  <desc id="f30-desc">Five boxes run left to right, Framework, Serialization or IR, Compiler or mapper, Runtime, and Device, joined by arrows. A vertical dashed line marks each of the four boundaries between neighboring boxes. Under every boundary four outlined pills read preserved, transformed, rejected, and unexercised, the four things that can happen to a contract field when it crosses that boundary. Three callouts hang from the first three boundaries and each copies one row of Table 26. At the framework boundary, SpikingJelly rate-coding recipe to SpikingJelly lava_exchange preserves nothing and transforms nothing, rejects subtractive reset and nonzero fixed reset with an explicit error at five call sites, and is unsupported with route state blocked, so the rejected pill is filled. At the intermediate representation boundary, NIR 1.0.8 to Sinabs 3.1.3, read from the intermediate representation back into a framework, turns a fixed reset into a subtractive reset because the importer does not pass the node&#8217;s reset value, a schema with no field for reset by subtraction, and is transformed with route state physical, so the transformed pill is filled. At the mapper boundary, NxTF logical soft-reset neuron to Loihi 1 compartment graph preserves the logical subtractive-reset behavior within fixed-point limits by turning one logical neuron into two hardware compartments, an emulated capability with route state physical, so both the preserved and the transformed pills are filled. The fourth boundary, runtime to device, carries no callout. Conceptual figure; no measured quantity is drawn.</desc>
