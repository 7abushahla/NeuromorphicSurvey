     Entry points, from Table 16 (pipeline stage of entry) and the 8.7 paragraphs that define each term. Clipping at parameter mapping (the chosen scale).
     Discretization at the counting operation (grid spacing 1/T). Residual membrane potential at the reset stage at window cutoff. Unevenness at the reset stage, per unit,
     as the dispersion of the reset term across the units of one layer (the 8.7 caveat separates it from timing). Timing at temporal execution across depth, at least
     one step per layer, drawn on the arrows between layers. Encoding at the source (8.7, deterministic under direct encoding, a random variable under Poisson).
     Readout inherits what the deepest layer has accumulated, and a count or rate readout adds one more instance of the discretization term (8.7 and 8.8).
     Band, from 8.6 (no source proves the four terms additive or governed by one growth law across architectures and reset rules), Table 16 (compounds with depth)
     and the 8.8 key point (compounded further by normalization, pooling, residual paths, and depth). -->

<figcaption><b>Figure 19:</b> The finite-time error terms Section 8.7 names, drawn where each enters a layered converted network. Clipping enters at parameter mapping, where the activation scale of each layer is fixed, and discretization at the counting operation, so both sit on the activation half of every layer; residual membrane potential and its unevenness dispersion enter at the reset stage of every layer's neuron; timing enters on every hop between layers, at least one step per layer. The encoder decides at the input whether every term is deterministic or, under Poisson encoding, a random variable, and a count or rate readout applies one more instance of discretization at the output. The band widens because Section 8.8 states that each added layer contributes its own instance of all four mechanisms plus its own minimum propagation delay, and Section 8.6 states that no reviewed source proves the terms additive or governed by one growth law across architectures and reset rules. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
