      <title id="f14title">Reset-to-zero and reset-by-subtraction on one finite input sequence</title>
      <desc id="f14desc">Derived example. The same five-step input sequence, the first five steps of the input that Figure 15 carries to eight, summing to 2.75 θ, is evaluated by two discrete integrate-and-fire neurons with threshold one and no leak. The two states coincide until the first crossing at step 3. Reset-to-zero discards the residual charge above threshold at that spike, 0.85 θ, whereas reset-by-subtraction retains it in the state and integrates it again at the next step. The resulting spike sequences differ, 00100 with one spike against 00110 with two spikes, and 0.75 θ remains on the reset-by-subtraction membrane at the end. A final panel separates this model semantic from whether a hardware platform supports it natively, by transformation, or by emulation.</desc>

  <div class="fig-hint">Hover a panel for the semantic distinction it carries.</div>
  <figcaption><b>Figure 14:</b> What happens to the residual charge \(r[t]=\tilde{u}[t]-\theta\) under the two reset rules, derived by computing the staged update of Section 3.2 with \(\theta=1\), no leak, and no bias on the first five steps of the input Figure 15 carries to eight, which sum to \(2.75\,\theta\). The two states coincide until the first crossing at step 3. Reset-to-zero discards the residual there, \(0.85\,\theta\) of charge, so the state restarts from zero and the neuron fires once in this window. Reset-by-subtraction keeps the residual inside \(u[t]\), where the membrane stage integrates it again at the next step, so the neuron fires at steps 3 and 4, twice, with \(0.75\,\theta\) still on the membrane at the end. Every table value is computed, and the conclusions are confined to this window. Whether a target implements either rule natively, through a transformation, or by emulation is a separate question from the rule itself.</figcaption>
</figure>
