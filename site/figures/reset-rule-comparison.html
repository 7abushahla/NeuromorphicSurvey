      <title id="f13title">Reset-to-zero and reset-by-subtraction on one finite input sequence</title>

  <div class="fig-hint">Hover a panel for the semantic distinction it carries.</div>
  <figcaption><b>Figure 13:</b> What happens to the residual charge \(r[t]=\tilde{u}[t]-\theta\) under the two reset rules, derived by computing the staged update of Section 3.2 with \(\theta=1\), no leak, and no bias on one five-step input. Reset-to-zero discards the residual, so after the first spike the state restarts from zero and the neuron fires at steps 1, 3, and 5. Reset-by-subtraction keeps the residual inside \(u[t]\), where the membrane stage integrates it again at the next step, so the neuron fires at steps 1, 2, and 4 with a different state trajectory throughout. Every table value is computed, and the conclusions are confined to this window. Whether a target implements either rule natively, through a transformation, or by emulation is a separate question from the rule itself.</figcaption>
