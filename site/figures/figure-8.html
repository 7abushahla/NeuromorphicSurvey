<figure class="pfig l-body" id="figure-8">
  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1180 760" role="img" aria-labelledby="f8title f8desc">
    <title id="f8title">Parallel layer computations in an artificial neural network and a spiking neural network</title>
    <desc id="f8desc">The upper path represents values through a weighted aggregation and static nonlinearity. The lower path represents discrete events, accumulates only arriving events into persistent state, applies a threshold and reset, then emits events. An annotation separates the representation from whether a particular implementation executes conditionally.</desc>
    <defs>
      <marker id="f8arr" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#000"/></marker>
      <marker id="f8arrred" markerWidth="11" markerHeight="8" refX="10" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#D63A2F"/></marker>
    </defs>

    <text x="46" y="44" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:700" fill="#000">One layer, two representations</text>
    <text x="46" y="72" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">The representation fixes what is carried between units. The execution schedule is a separate implementation choice.</text>

    <g class="f8-hot">
      <title>An ANN layer carries a real-valued activation. Its value is complete for the current evaluation, even if that value happens to be zero.</title>
      <rect x="42" y="102" width="1096" height="212" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <rect x="42" y="102" width="184" height="212" rx="10" fill="#CFE2F3"/>
      <path d="M42,142 V112 A10,10 0 0 1 52,102 H216 A10,10 0 0 1 226,112 V142 Z" fill="#8fbfef"/>
      <line x1="42" y1="142" x2="226" y2="142" stroke="#000" stroke-width="2.2"/>
      <text x="134" y="128" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700" fill="#000">ANN layer</text>
      <text x="134" y="173" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;letter-spacing:1px" fill="#555">REPRESENTATION</text>
      <text x="134" y="206" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">real-valued activation</text>
      <text x="134" y="236" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:25px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">a</tspan><tspan dy="6" style="font-size:16px">j</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif"> ∈ ℝ</tspan></text>
      <rect class="f8-band" x="42" y="102" width="184" height="212" rx="10" fill="#8fbfef" opacity="0"/>
      <rect x="42" y="102" width="184" height="212" fill="#000" opacity="0" pointer-events="all"/>
    </g>

    <g class="f8-hot">
      <title>Weighted aggregation combines every input value with its associated weight. This diagram is a computation model, not a promise that every implementation performs a dense MAC for every zero.</title>
      <rect x="260" y="164" width="190" height="102" rx="8" fill="#CDEBCD" stroke="#000" stroke-width="2.2"/>
      <text x="355" y="194" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Weighted</text>
      <text x="355" y="220" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">aggregation</text>
      <text x="355" y="247" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">Σ <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">w</tspan><tspan dy="6" style="font-size:14px">ij</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif"> </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">a</tspan><tspan dy="6" style="font-size:14px">j</tspan></text>
      <rect class="f8-band" x="260" y="164" width="190" height="102" rx="8" fill="#CDEBCD" opacity="0"/>
      <rect x="260" y="164" width="190" height="102" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="226" y1="215" x2="260" y2="215" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>

    <g class="f8-hot">
      <title>A static nonlinearity maps the aggregated value to the layer output. It does not preserve a state from the preceding algorithmic step.</title>
      <rect x="492" y="164" width="190" height="102" rx="8" fill="#FFDDA6" stroke="#000" stroke-width="2.2"/>
      <text x="587" y="194" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Static</text>
      <text x="587" y="220" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">nonlinearity</text>
      <text x="587" y="247" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">a</tspan> = <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">φ</tspan>(Σ <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">wa</tspan>)</text>
      <rect class="f8-band" x="492" y="164" width="190" height="102" rx="8" fill="#FFDDA6" opacity="0"/>
      <rect x="492" y="164" width="190" height="102" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="450" y1="215" x2="492" y2="215" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>

    <g class="f8-hot">
      <title>The output is another real-valued activation, available to the next layer during this evaluation.</title>
      <rect x="726" y="164" width="190" height="102" rx="8" fill="#CFE2F3" stroke="#000" stroke-width="2.2"/>
      <text x="821" y="194" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Output value</text>
      <text x="821" y="229" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:26px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">a</tspan><tspan dy="6" style="font-size:16px">i</tspan></text>
      <rect class="f8-band" x="726" y="164" width="190" height="102" rx="8" fill="#CFE2F3" opacity="0"/>
      <rect x="726" y="164" width="190" height="102" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="682" y1="215" x2="726" y2="215" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>
    <text x="944" y="202" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">No persistent state</text>
    <text x="944" y="228" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#555">between algorithmic steps</text>
    <line x1="916" y1="215" x2="936" y2="215" stroke="#000" stroke-width="2.2"/>

    <g class="f8-hot">
      <title>An SNN layer carries discrete events. A binary event can signal activity without carrying a real-valued activation on that edge.</title>
      <rect x="42" y="364" width="1096" height="264" rx="10" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <rect x="42" y="364" width="184" height="264" rx="10" fill="#F9D4EA"/>
      <path d="M42,404 V374 A10,10 0 0 1 52,364 H216 A10,10 0 0 1 226,374 V404 Z" fill="#D63A2F"/>
      <line x1="42" y1="404" x2="226" y2="404" stroke="#000" stroke-width="2.2"/>
      <text x="134" y="390" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:24px;font-weight:700" fill="#fff">SNN layer</text>
      <text x="134" y="435" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;letter-spacing:1px" fill="#555">REPRESENTATION</text>
      <text x="134" y="466" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">discrete events</text>
      <text x="134" y="496" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:25px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">z</tspan><tspan dy="6" style="font-size:16px">j</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif">[</tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan><tspan style="font-family:Arial,Helvetica,sans-serif">] ∈ {0,1}</tspan></text>
      <line x1="76" y1="540" x2="190" y2="540" stroke="#000" stroke-width="1.8"/>
      <line x1="92" y1="540" x2="92" y2="514" stroke="#D63A2F" stroke-width="4.6"/>
      <line x1="132" y1="540" x2="132" y2="522" stroke="#D63A2F" stroke-width="4.6"/>
      <line x1="172" y1="540" x2="172" y2="506" stroke="#D63A2F" stroke-width="4.6"/>
      <text x="134" y="575" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">events across time</text>
      <rect class="f8-band" x="42" y="364" width="184" height="264" rx="10" fill="#D63A2F" opacity="0"/>
      <rect x="42" y="364" width="184" height="264" fill="#000" opacity="0" pointer-events="all"/>
    </g>

    <g class="f8-hot">
      <title>For fixed-weight binary or unit-payload events, an arriving event selects a known weight and can be accumulated without a runtime multiplication. This is not true for every event representation.</title>
      <rect x="260" y="438" width="202" height="118" rx="8" fill="#CDEBCD" stroke="#000" stroke-width="2.2"/>
      <text x="361" y="468" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Weighted accumulation</text>
      <text x="361" y="498" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px" fill="#000">Σ <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">w</tspan><tspan dy="6" style="font-size:13px">ij</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif"> </tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">z</tspan><tspan dy="6" style="font-size:13px">j</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif">[</tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan><tspan style="font-family:Arial,Helvetica,sans-serif">]</tspan></text>
      <text x="361" y="530" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">only arriving events need work</text>
      <rect class="f8-band" x="260" y="438" width="202" height="118" rx="8" fill="#CDEBCD" opacity="0"/>
      <rect x="260" y="438" width="202" height="118" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="226" y1="497" x2="260" y2="497" stroke="#D63A2F" stroke-width="2.6" marker-end="url(#f8arrred)"/>

    <g class="f8-hot">
      <title>The membrane state persists. At the next timestep it starts from its previous value, rather than recomputing only from the current input events.</title>
      <rect x="502" y="438" width="196" height="118" rx="8" fill="#FFFF66" stroke="#000" stroke-width="2.2"/>
      <text x="600" y="468" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:700" fill="#000">Persistent state</text>
      <text x="600" y="500" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">u</tspan><tspan dy="6" style="font-size:14px">i</tspan><tspan dy="-6" style="font-family:Arial,Helvetica,sans-serif">[</tspan><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan><tspan style="font-family:Arial,Helvetica,sans-serif">−1] + current</tspan></text>
      <path d="M552,536 C538,590 661,590 648,536" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>
      <text x="600" y="606" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">retained to the next step</text>
      <rect class="f8-band" x="502" y="438" width="196" height="118" rx="8" fill="#FFFF66" opacity="0"/>
      <rect x="502" y="438" width="196" height="118" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="462" y1="497" x2="502" y2="497" stroke="#D63A2F" stroke-width="2.6" marker-end="url(#f8arrred)"/>

    <g class="f8-hot">
      <title>Thresholding converts state into an output event. The threshold is non-differentiable, which is why direct SNN training needs a stated gradient treatment.</title>
      <rect x="738" y="438" width="156" height="118" rx="8" fill="#FFDDA6" stroke="#000" stroke-width="2.2"/>
      <text x="816" y="476" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Threshold</text>
      <text x="816" y="510" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">u</tspan>[<tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan>] ≥ <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">θ</tspan> ?</text>
      <rect class="f8-band" x="738" y="438" width="156" height="118" rx="8" fill="#FFDDA6" opacity="0"/>
      <rect x="738" y="438" width="156" height="118" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="698" y1="497" x2="738" y2="497" stroke="#D63A2F" stroke-width="2.6" marker-end="url(#f8arrred)"/>

    <g class="f8-hot">
      <title>Reset modifies the state after an emitted event. Whether it resets to a value or subtracts threshold is a semantic choice that must survive the software and hardware route.</title>
      <rect x="932" y="438" width="166" height="118" rx="8" fill="#F9D4EA" stroke="#000" stroke-width="2.2"/>
      <text x="1015" y="476" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Reset</text>
      <text x="1015" y="510" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">u</tspan> ← reset rule</text>
      <text x="1015" y="535" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">after an event</text>
      <rect class="f8-band" x="932" y="438" width="166" height="118" rx="8" fill="#F9D4EA" opacity="0"/>
      <rect x="932" y="438" width="166" height="118" fill="#000" opacity="0" pointer-events="all"/>
    </g>
    <line x1="894" y1="497" x2="932" y2="497" stroke="#D63A2F" stroke-width="2.6" marker-end="url(#f8arrred)"/>
    <line x1="816" y1="556" x2="816" y2="584" stroke="#D63A2F" stroke-width="2.6" marker-end="url(#f8arrred)"/>
    <line x1="802" y1="592" x2="830" y2="592" stroke="#000" stroke-width="1.8"/>
    <line x1="808" y1="592" x2="808" y2="572" stroke="#D63A2F" stroke-width="4.6"/>
    <line x1="824" y1="592" x2="824" y2="563" stroke="#D63A2F" stroke-width="4.6"/>
    <text x="850" y="598" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">emitted events</text>

    <g class="f8-hot">
      <title>Activity sparsity is a property of the event stream. Conditional execution is a property of a particular accelerator, runtime, and mapping. One does not automatically establish the other.</title>
      <rect x="42" y="666" width="1096" height="58" rx="8" fill="#fff" stroke="#000" stroke-width="2.2"/>
      <rect x="42" y="666" width="250" height="58" rx="8" fill="#F9D4EA"/>
      <text x="60" y="690" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Activity sparsity</text>
      <text x="60" y="713" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">few events arrive at a step</text>
      <line x1="312" y1="695" x2="414" y2="695" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>
      <rect x="434" y="666" width="294" height="58" rx="8" fill="#CDEBCD"/>
      <text x="452" y="690" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Conditional execution</text>
      <text x="452" y="713" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">a platform may skip inactive work</text>
      <line x1="748" y1="695" x2="850" y2="695" stroke="#000" stroke-width="2.2" marker-end="url(#f8arr)"/>
      <rect x="870" y="666" width="268" height="58" rx="8" fill="#d5dbe2"/>
      <text x="888" y="690" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:700" fill="#000">Deployment check</text>
      <text x="888" y="713" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#000">verify the actual route</text>
      <rect class="f8-band" x="42" y="666" width="1096" height="58" rx="8" fill="#D63A2F" opacity="0"/>
      <rect x="42" y="666" width="1096" height="58" fill="#000" opacity="0" pointer-events="all"/>
    </g>
  </svg></div>
  <div class="fig-hint">Hover a block for the represented quantity, state transition, or execution claim it separates.</div>
  <figcaption><b>Figure 8:</b> An ANN layer propagates real-valued activations through weighted aggregation and a static nonlinearity. An SNN layer propagates events, accumulates their effect into persistent state, applies a threshold and reset, and emits later events. Event sparsity does not by itself prove conditional execution. For fixed-weight binary or unit-payload events, an arriving event can select and accumulate a known weight without a runtime multiplication. Graded payloads can instead require multiplication or another transformed operation.</figcaption>
</figure>
