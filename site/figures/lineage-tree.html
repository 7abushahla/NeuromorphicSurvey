    <title id="f3title">Two lineages from the biological neuron meet in the spiking neural network, and hardware enters below the rejoin</title>
    <desc id="f3desc">Conceptual lineage tree. From a biological neuron root, a physical-behavior branch runs through Lapicque's 1907 model to integrate-and-fire and leaky integrate-and-fire, and through the Hodgkin-Huxley description of 1952 to reduced dynamical models (FitzHugh-Nagumo, Izhikevich 2003, AdEx 2005). A computational-abstraction branch runs from McCulloch and Pitts in 1943 through the perceptron to artificial and convolutional networks, which continue as deep learning and reach the spiking network only by a dashed conversion edge. Cross-cutting threads for coding and learning (Adrian 1926, Shannon 1948, Hebb 1949, rank order coding by Thorpe in 1998) also feed the rejoin. The branches rejoin at the spiking neural network, named the third generation by Maass in 1997, and a dynamic vision sensor of 2008 enters from the side. Below the rejoin a hardware column runs Mead 1990, the silicon neuron of 1991, and address-event representation (Mahowald 1992, Boahen 2000), then fans out to five platform families named without dates, with the basis for each edge stated per platform record in the caption. A sixth box, Akida, the survey's event NPU, stands at the right end of the row with a dashed outline and receives one dashed edge, from the ANN and CNN node by conversion, and none from address-event representation. A strip along the bottom lists the dated nodes in year order with even spacing.</desc>

  <figcaption><b>Figure 3:</b> The lineages that meet in a spiking neural network, and where hardware enters. The physical-behavior branch runs through Lapicque's 1907 model<d-cite key="lapicque1907"></d-cite> to integrate-and-fire (IF) and leaky integrate-and-fire (LIF), and separately through the Hodgkin-Huxley description of 1952<d-cite key="hodgkin1952"></d-cite> to reduced dynamical models such as the Izhikevich model of 2003<d-cite key="izhikevich2003"></d-cite> and the adaptive exponential (AdEx) model of Brette and Gerstner, 2005<d-cite key="brette2005-adex"></d-cite>, both of which reduce the 1952 description's subthreshold dynamics while keeping IF's imposed threshold and reset; IF descends from 1907, not from a later simplification of 1952. The computational-abstraction branch runs from the McCulloch-Pitts logical unit of 1943<d-cite key="mcculloch1943"></d-cite> through the perceptron to the artificial neural network (ANN) and the convolutional neural network (CNN), and continues as deep learning in its own literature; a trained ANN or CNN enters the SNN only through conversion, so that edge is dashed, and what the SNN keeps directly is the layered, weighted architecture. Four cross-cutting threads feed the rejoin, Adrian and Zotterman's 1926 observation that impulse rate follows stimulus strength<d-cite key="adrian1926"></d-cite>, which precedes Shannon's 1948 theory of communication<d-cite key="shannon1948"></d-cite>, Hebb's 1949 rule<d-cite key="hebb1949"></d-cite>, and the rank order coding of Thorpe and Gautrais, 1998<d-cite key="Thorpe98-RankOrder"></d-cite>. The branches rejoin at the SNN, named the third generation of neural network models by Maass in 1997<d-cite key="maass1997"></d-cite>, and the dynamic vision sensor of 2008<d-cite key="lichtsteiner2008-dvs"></d-cite> enters from the side, emitting events directly rather than through either branch. Hardware enters below the rejoin with Mead's 1990 paper<d-cite key="mead1990"></d-cite>, asking whether hardware can implement rather than simulate the computation. The silicon neuron of Mahowald and Douglas, 1991<d-cite key="mahowald1991-silicon-neuron"></d-cite>, answers for one neuron, and address-event representation (AER), set out by Mahowald in 1992<d-cite key="mahowald1992-aer"></d-cite> and by Boahen in 2000<d-cite key="boahen2000-aer"></d-cite>, carries events between chips. The fan-out to the platform families rests on each platform's own record, source-addressed spike packets over a multicast fabric for sPyNNaker<d-cite key="spynnaker-v8-docs"></d-cite>, address, feature, polarity and timestamp events for Speck<d-cite key="synsense-speck-datasheet"></d-cite>, and address event-encoded packets for BrainScaleS-2<d-cite key="bss"></d-cite>. The Loihi 2 brief<d-cite key="loihi2"></d-cite> names AER only among the chip's external interfaces and describes communication between neuron cores as spike messages, and the TrueNorth article<d-cite key="merolla2014-truenorth"></d-cite> was not read beyond its metadata, so the figure states nothing further for it. Akida stands at the right end of the row with a dashed outline as the survey's event NPU. It enters the row by conversion, since the CNN2SNN guide<d-cite key="brainchip-cnn2snn-docs"></d-cite> converts convolutional networks trained by deep learning into a spiking network for the Akida runtime, the event NPU of <a href="#event-npu">Section 5.5</a>, and no edge reaches it from AER because no BrainChip page read for this survey documents an address-event lineage. Its sub-label says rank coding because BrainChip's tech brief<d-cite key="brainchip-akida-techbrief"></d-cite> names rank coding as the processor's encoding scheme. The platform families carry no dates because the tree is not a timeline; the strip along the bottom orders the dated nodes by year with even spacing, so distances along it carry no meaning. The figure is a conceptual illustration whose dates come from the cited primary sources, a dependency picture and not a claim that any later work cites an earlier one.</figcaption>
