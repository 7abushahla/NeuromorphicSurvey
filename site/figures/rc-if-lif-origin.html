    <title id="f9title">The RC origin of integrate-and-fire and leaky integrate-and-fire neurons</title>
    <desc id="f9desc">Conceptual illustration. A parallel resistor-capacitor circuit receives synaptic and external current. Its capacitor voltage is the membrane potential and its leak conductance discharges it toward the resting potential, giving the leaky integrate-and-fire equation with time constant capacitance over conductance. Zero leak conductance, equivalently infinite membrane resistance, gives the integrate-and-fire limit. Threshold and reset are shown separately because they are not properties of the passive circuit. A final panel lists the three meanings of the electrical terms, modeled quantity, dimensionless software state, and physical circuit quantity.</desc>

  <figcaption><b>Figure 9:</b> Conceptual illustration of where the vocabulary of current, capacitance, membrane voltage, leak, threshold, and reset comes from. In the idealized parallel circuit the membrane capacitance \(C_m\) stores charge, the membrane potential \(V(\tau)\) is the voltage across it, synaptic and external currents change the stored charge, and the leak conductance \(g_L\), equivalently the membrane resistance \(R_m=1/g_L\), discharges it toward the resting potential \(E_L\) with time constant \(\tau_m=C_m/g_L=R_mC_m\) whenever \(g_L>0\). The integrate-and-fire model is the limit \(g_L=0\), equivalently \(R_m\rightarrow\infty\); the beginner phrase that IF has no resistor is this limit in circuit language. Threshold and reset need a comparator and a reset mechanism beyond the passive branch. The same equation carries three meanings. In a mathematical neuron model, current and voltage are modeled quantities. In software they are often dimensionless or fixed-point state variables that preserve the equation without representing amperes or volts. In analog or mixed-signal hardware they can be physical circuit quantities, while digital hardware realizes the same recurrence with integer accumulators.</figcaption>
