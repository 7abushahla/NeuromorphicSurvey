<figure class="pfig l-body" id="figure-19">
  <div style="max-width: 720px; margin: 0 auto;"><svg viewBox="0 0 1600 1048" role="img" aria-label="Eight neural codes, each drawn for one illustrative value, 0.75, under one stated convention per code in an eight-step window, with its spike pattern, what carries the value, and an illustrative cost in spikes and timesteps. The codes do not share a precision. Reported numbers in the cost column are cited in the caption."><defs><marker id="f19a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#666"/></marker><marker id="f19ax" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#000"/></marker></defs><text x="22" y="34" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:22px" fill="#000">Each panel shows one illustrative value, <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">x</tspan> = 0.75, under one stated convention per code, in an 8-step window. The codes do not share a precision.</text><text x="22" y="72" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#333">Code</text><text x="258" y="72" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#333">Spike pattern</text><rect x="452" y="54" width="10" height="20" fill="#D63A2F"/><text x="470" y="72" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">binary spike</text><rect x="592" y="54" width="16" height="20" fill="#FFDDA6" stroke="#000" stroke-width="1.6"/><text x="616" y="72" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">graded spike</text><line x1="740" y1="64" x2="766" y2="64" stroke="#8fbfef" stroke-width="4.6"/><text x="774" y="72" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">analog current</text><text x="900" y="72" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#333">What carries the value</text><text x="1250" y="72" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#333">Illustrative cost</text><line x1="16" y1="84" x2="1584" y2="84" stroke="#c9d2db" stroke-width="1.8"/><g class="f19-row"><title>Counting spikes is what fixes the grid spacing at one over T. A rate code is therefore a uniform quantizer by construction, not by design choice.</title><rect class="f19-band" x="16" y="96" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="96" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>One spike can in principle carry unlimited precision in its timing. Hardware quantizes firing times to discrete steps, which puts the precision floor back.</title><rect class="f19-band" x="16" y="196" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="196" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>Each phase carries a different weight, so an early spike is worth many late ones. Three steps reach the eight levels a rate code spends eight steps on.</title><rect class="f19-band" x="16" y="296" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="296" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>Burst coding sits between rate and TTFS. It keeps the count-based grid but lifts the one-spike-per-step ceiling, so the same count fits in a shorter window.</title><rect class="f19-band" x="16" y="396" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="396" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>A population is a spatial axis rather than a fourth code. Each neuron inside it can itself be rate coded or time coded.</title><rect class="f19-band" x="16" y="496" width="1568" height="140" fill="#D63A2F" opacity="0"/><rect x="16" y="496" width="1568" height="140" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>Only changes are transmitted, so a static input costs nothing. This needs a spike that can carry a number, which is why it is tied to graded-spike hardware.</title><rect class="f19-band" x="16" y="636" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="636" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>The code is one permutation out of N factorial. A rate-matching correspondence has no magnitude to converge to here, so the value itself is not recoverable from the order.</title><rect class="f19-band" x="16" y="736" width="1568" height="140" fill="#D63A2F" opacity="0"/><rect x="16" y="736" width="1568" height="140" fill="#000" opacity="0" pointer-events="all"/></g><g class="f19-row"><title>Feeding real-valued current removes input quantization entirely, at the cost of a first layer that multiplies rather than accumulates, so it is not spiking.</title><rect class="f19-band" x="16" y="876" width="1568" height="100" fill="#D63A2F" opacity="0"/><rect x="16" y="876" width="1568" height="100" fill="#000" opacity="0" pointer-events="all"/></g><g pointer-events="none"><line x1="16" y1="196" x2="1584" y2="196" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="296" x2="1584" y2="296" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="396" x2="1584" y2="396" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="496" x2="1584" y2="496" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="636" x2="1584" y2="636" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="736" x2="1584" y2="736" stroke="#e8edf2" stroke-width="1.2"/><line x1="16" y1="876" x2="1584" y2="876" stroke="#e8edf2" stroke-width="1.2"/><line x1="246" y1="88" x2="246" y2="976" stroke="#e8edf2" stroke-width="1.2"/><line x1="890" y1="88" x2="890" y2="976" stroke="#e8edf2" stroke-width="1.2"/><line x1="1240" y1="88" x2="1240" y2="976" stroke="#e8edf2" stroke-width="1.2"/><line x1="286" y1="96" x2="286" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="362" y1="96" x2="362" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="438" y1="96" x2="438" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="514" y1="96" x2="514" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="590" y1="96" x2="590" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="666" y1="96" x2="666" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="742" y1="96" x2="742" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><line x1="818" y1="96" x2="818" y2="1004" stroke="#e3e8ee" stroke-width="1.2"/><text x="22" y="130" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Rate coding</text><text x="22" y="154" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">count, deterministic</text><line x1="258" y1="176" x2="878" y2="176" stroke="#000" stroke-width="2.2"/><rect x="357.0" y="130" width="10" height="46" fill="#D63A2F"/><rect x="433.0" y="130" width="10" height="46" fill="#D63A2F"/><rect x="509.0" y="130" width="10" height="46" fill="#D63A2F"/><rect x="661.0" y="130" width="10" height="46" fill="#D63A2F"/><rect x="737.0" y="130" width="10" height="46" fill="#D63A2F"/><rect x="813.0" y="130" width="10" height="46" fill="#D63A2F"/><text x="878" y="190" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">6 spikes / 8 steps = 0.75</text><text x="900" y="130" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">Spike count over the window.</text><text x="900" y="152" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">A uniform 1/T grid, by construction.</text><text x="1250" y="130" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">8 steps, 6 spikes</text><text x="1250" y="156" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Poisson input needs many more steps for</text><text x="1250" y="177" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">equal precision, see the caption.</text><text x="22" y="230" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">TTFS</text><text x="22" y="254" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">latency</text><line x1="258" y1="276" x2="878" y2="276" stroke="#000" stroke-width="2.2"/><line x1="260" y1="224" x2="428" y2="224" stroke="#666" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#f19a)"/><text x="348.0" y="216" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">latency</text><rect x="433.0" y="230" width="10" height="46" fill="#D63A2F"/><text x="878" y="290" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">spike in slot 3 of 8</text><text x="900" y="230" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">Latency of one spike, measured</text><text x="900" y="252" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">from the onset of the window.</text><text x="1250" y="230" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">8 steps, 1 spike</text><text x="1250" y="256" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Spikes drop by 6&#215;, but the window still</text><text x="1250" y="277" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">has to resolve 8 timing slots.</text><text x="22" y="330" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Phase</text><text x="22" y="354" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">cycle <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">K</tspan> = 3</text><line x1="258" y1="376" x2="878" y2="376" stroke="#000" stroke-width="2.2"/><rect x="258" y="330" width="218" height="46" fill="#CFE2F3" opacity="0.45"/><text x="286" y="322" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">1/2</text><rect x="281.0" y="330" width="10" height="46" fill="#D63A2F"/><text x="362" y="322" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">1/4</text><rect x="357.0" y="330" width="10" height="46" fill="#D63A2F"/><text x="438" y="322" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#9aa5b1">1/8</text><text x="878" y="390" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">cycle of 3 &#183; 1/2 + 1/4 = 0.75</text><text x="900" y="330" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">Which phase of a K-step cycle the</text><text x="900" y="352" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">spike falls in. Powers-of-two</text><text x="900" y="374" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">weights, so early spikes count more.</text><text x="1250" y="330" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">3 steps, 2 spikes</text><text x="1250" y="356" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">One step per bit, but every layer pays</text><text x="1250" y="377" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">the cycle, near 3,000 steps reported for 32 layers.</text><text x="22" y="430" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Burst</text><text x="22" y="454" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">multi-spike step</text><line x1="258" y1="476" x2="878" y2="476" stroke="#000" stroke-width="2.2"/><rect x="281.0" y="464" width="10" height="12" fill="#D63A2F"/><rect x="281.0" y="447" width="10" height="12" fill="#D63A2F"/><rect x="281.0" y="430" width="10" height="12" fill="#D63A2F"/><rect x="357.0" y="464" width="10" height="12" fill="#D63A2F"/><rect x="357.0" y="447" width="10" height="12" fill="#D63A2F"/><rect x="357.0" y="430" width="10" height="12" fill="#D63A2F"/><text x="878" y="490" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">3 + 3 unit spikes, cap 3 per step</text><text x="900" y="430" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">Spike count again, but one step</text><text x="900" y="452" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">may carry several unit spikes.</text><text x="1250" y="430" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">3 steps, 6 spikes</text><text x="1250" y="456" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Needs a neuron that can emit several</text><text x="1250" y="477" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">spikes inside one timestep.</text><text x="22" y="550" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Population</text><text x="22" y="574" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">N</tspan> = 8 neurons</text><line x1="258" y1="616" x2="878" y2="616" stroke="#000" stroke-width="2.2"/><rect x="280" y="604" width="12" height="12" fill="#D63A2F"/><rect x="280" y="590" width="12" height="12" fill="#D63A2F"/><rect x="280" y="576" width="12" height="12" fill="#D63A2F"/><rect x="280" y="562" width="12" height="12" fill="#D63A2F"/><rect x="280" y="548" width="12" height="12" fill="#D63A2F"/><rect x="280" y="534" width="12" height="12" fill="#D63A2F"/><rect x="280" y="520" width="12" height="12" fill="#fff" stroke="#9aa5b1" stroke-width="1.6"/><rect x="280" y="506" width="12" height="12" fill="#fff" stroke="#9aa5b1" stroke-width="1.6"/><text x="302" y="614" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#777"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">n</tspan>1</text><text x="302" y="516" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#777"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">n</tspan>8</text><text x="878" y="630" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">6 of 8 neurons fire, one step</text><text x="900" y="548" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">Which of the N neurons fire. A</text><text x="900" y="570" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">spatial axis, and each neuron may</text><text x="900" y="592" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">itself be rate or time coded.</text><text x="1250" y="548" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">1 step, 6 spikes, 8 neurons</text><text x="1250" y="574" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">Time traded for silicon. The cost scales</text><text x="1250" y="595" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">with neuron budget, not with latency.</text><text x="22" y="670" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Sigma-delta</text><text x="22" y="694" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">graded spike</text><line x1="258" y1="716" x2="878" y2="716" stroke="#000" stroke-width="2.2"/><rect x="276.0" y="670" width="20" height="46" fill="#FFDDA6" stroke="#000" stroke-width="1.8"/><text x="286" y="662" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#000">payload 0.75</text><text x="628.0" y="696" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">no spikes while the value holds</text><text x="878" y="730" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">one graded spike, then silence</text><text x="900" y="670" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">The change since the last send,</text><text x="900" y="692" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">carried as a payload on one spike.</text><text x="1250" y="670" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:20px" fill="#000">1 step, 1 graded spike</text><text x="1250" y="696" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">A documented 24-bit payload (Loihi 2)</text><text x="1250" y="717" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">carries far more. Needs graded spikes.</text><text x="22" y="790" text-anchor="start" font-weight="700" style="font-family:Arial,Helvetica,sans-serif;font-size:21px" fill="#000">Rank order</text><text x="22" y="814" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:15px" fill="#555">ordinal, <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">N</tspan> = 8</text><line x1="258" y1="856" x2="878" y2="856" stroke="#000" stroke-width="2.2"/><line x1="258" y1="850" x2="878" y2="850" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="836" x2="878" y2="836" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="822" x2="878" y2="822" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="808" x2="878" y2="808" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="794" x2="878" y2="794" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="780" x2="878" y2="780" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="766" x2="878" y2="766" stroke="#e2e8ee" stroke-width="1.2"/><line x1="258" y1="752" x2="878" y2="752" stroke="#e2e8ee" stroke-width="1.2"/><rect x="280" y="802" width="12" height="12" fill="#D63A2F"/><rect x="356" y="760" width="12" height="12" fill="#D63A2F"/><rect x="431" y="829" width="14" height="14" fill="#D63A2F" stroke="#000" stroke-width="2"/><text x="452" y="842" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000"><tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">x</tspan></text><rect x="508" y="844" width="12" height="12" fill="#D63A2F"/><rect x="584" y="774" width="12" height="12" fill="#D63A2F"/><rect x="660" y="816" width="12" height="12" fill="#D63A2F"/><rect x="736" y="746" width="12" height="12" fill="#D63A2F"/><rect x="812" y="788" width="12" height="12" fill="#D63A2F"/><text x="272" y="854" text-anchor="end" style="font-fam   <figcaption><b>Figure 19:</b> Eight neural codes, each drawn for one illustrative value, \(x = 0.75\), under one stated convention per code in an eight-step window. The panels show what each spike pattern means and what it costs under that convention; they do not carry a common precision, and the rank order panel carries no magnitude at all, so no equal-precision comparison across rows is intended. Counting the marks in a panel reproduces the spike count stated beside it. Rate coding under a deterministic count spends one spike per representable level, and Poisson input needs quadratically more steps for the same precision because its sampling variance decays only as the square root of the window <d-cite key="auge"></d-cite>. The cost column carries three reported numbers rather than values derived from the drawing, the roughly three thousand simulation steps reported for phase coding on a 32-layer network <d-cite key="swsc2024"></d-cite>, the 24-bit graded payload documented for Loihi 2 <d-cite key="sdnn"></d-cite>, and the \(\log_2(N!)\) channel capacity of a rank order code <d-cite key="thorpe1996-rankorder"></d-cite>. Direct input spends no input spikes at all by giving the first layer a real-valued current to multiply.</figcaption>
