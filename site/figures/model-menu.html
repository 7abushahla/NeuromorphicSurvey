    <!--
      Derived chart. Every plotted number is read from E. M. Izhikevich, "Which model to use for cortical spiking

      Fig. 2, p. 1066, as transcribed in research/foundations-sources.md (entry izhikevich2004-which-model).
      x is that figure's "# of FLOPS" column, floating-point operations needed to simulate the model for 1 ms.
      y is the count of plus cells across the 22 property columns of the same table (biophysically meaningful,
      twenty firing properties from tonic spiking to inhibition-induced bursting, chaos); minus and blank cells
      both count as not reproduced. Rows are numbered in the order the table prints them.
        row 1   integrate-and-fire, labeled LIF               x = 5     y = 3
        row 5   quadratic integrate-and-fire, labeled QIF     x = 7     y = 6
        row 2   integrate-and-fire with adapt., labeled ALIF  x = 10    y = 5
        row 6   Izhikevich (2003)                             x = 13    y = 21
        row 7   FitzHugh-Nagumo                               x = 72    y = 11
        row 9   Morris-Lecar                                  x = 600   y = 14
        row 11  Hodgkin-Huxley                                x = 1200  y = 19
      Tabulated in the same figure but not plotted because the survey does not name them: row 3
      integrate-and-fire-or-burst (13, 10), row 4 resonate-and-fire (10, 12), row 8 Hindmarsh-Rose (120, 18),
      row 10 Wilson (180, 15).
      AdEx has no row in the source. It is drawn hollow and dashed at x = 11.5, y = 13, a qualitative placement
      between ALIF (10, 5) and Izhikevich (13, 21), after Brette and Gerstner 2005, registry id brette2005-adex.
      Platform tags and statuses come from data/platform-capabilities.json, contract_field neuron_dynamics,
      platform_id brainscales-2, spinnaker-1, loihi-1, loihi-2, speck-2f, xylo-audio-2 and akida-1, every one
      capability_status native, verification_status provisional. The Loihi 2 record is native (locator
      "Programmable Neuron Models", CUBA-LIF and specialized dynamics); the LIF-to-Izhikevich extent of its
      bracket is this figure's construction over the programmable region, not a per-model claim in the source,
      and the registry records the SpikingJelly route to Loihi 2 as blocked.
      Mapping: px = 150 + 1000 * log10(x / 3) / log10(2000 / 3); py = 700 - (535 / 23) * y.
    -->

  <figcaption><b>Figure 7:</b> The neuron-model menu, derived from Izhikevich&#8217;s 2004 comparison<d-cite key="izhikevich2004-which-model"></d-cite>. The x axis is implementation cost in floating-point operations per millisecond of simulated time, drawn on a logarithmic scale because the tabulated costs run from 5 to 1200 and a linear axis would stack the cheap models on the left edge. The y axis is biological plausibility as the number of neurocomputational features a model reproduces, counted as the plus cells across the 22 property columns of the source table. Filled points carry the source&#8217;s exact numbers for the seven tabulated models this survey names; the source&#8217;s integrate-and-fire is leaky and is labeled LIF, and the integrate-and-fire model derived later in this section is its zero-leak limit at the same point. The hollow AdEx point postdates the comparison and is placed qualitatively between ALIF and Izhikevich after Brette and Gerstner<d-cite key="brette2005-adex"></d-cite>. Bold red tags carry the capability registry&#8217;s recorded status for the model each audited platform executes, BrainScaleS-2 in calibrated analog circuits at AdEx<d-cite key="bss"></d-cite>, SpiNNaker 1 as software kernels at Izhikevich and at LIF<d-cite key="rhodes2018-spynnaker"></d-cite>, Loihi 1 as current-based LIF<d-cite key="loihi1"></d-cite>, and Speck<d-cite key="synsense-speck-datasheet"></d-cite> and Xylo<d-cite key="rockpool-xylo-docs"></d-cite> at IF and LIF. The registry records Loihi 2&#8217;s neuron engine as native and microcode-programmable<d-cite key="loihi2"></d-cite>, so its tag is a bracket over the span from LIF to Izhikevich rather than a point on one model. Akida executes no membrane recurrence and is not on the chart. The audited platforms cluster at the efficient end; no audited route executes Hodgkin-Huxley, whose update costs 240 times the integrate-and-fire update by the source&#8217;s count.</figcaption>
