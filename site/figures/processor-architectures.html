  <title id="f21-title">Three architectures on one axis from von Neumann to non-von Neumann, a general processor, a neural processing unit, and a neuromorphic chip, drawn by where the memory sits relative to the arithmetic</title>
  <desc id="f21-desc">Three panels side by side above one axis that runs left to right from von Neumann to non-von Neumann. Panel (a), a general processor, in the conventional bucket's blue tint, holds a hatched memory box labeled instructions and numbers above a processor frame that holds a control box and an arithmetic box side by side; a double-headed arrow between the memory and the frame is labeled one word at a time, the von Neumann bottleneck, and the frame notes that the control reads its orders from the same memory. Panel (b), a neural processing unit, in the same blue tint, holds a hatched memory box labeled off-chip, as a processor's, with an arrow from the memory into a frame labeled NPU, where it lands on a hatched on-chip buffer feeding a two by two array of processing elements, noted as a multiply-accumulate array with fewer reads from the buffer; a footer reads the memory stays outside the array. Panel (c), a neuromorphic chip, in the neuromorphic bucket's warm tint, has no memory box; its left half, labeled near-memory, is a three by three array of processing elements each with a separate hatched memory box beside it, and its right half, labeled in-memory, is a three by three array of hatched memory boxes each enclosing a small white processing-element pill; a note reads decentralized many-core, computation and memory tightly coupled, and the footer reads a weight is synapse state beside the neuron. Under the axis the chip words of Table 10 sit beneath the panel that carries them, CPU, GPU, MCU and RISC-V under (a), NPU under (b), neuromorphic and FPGA under (c). A key marks hatched as memory and plain as control, arithmetic, or a processing element. Conceptual figure; no measured quantity is drawn.</desc>

<figcaption><b>Figure 21:</b> Three architectures on one axis. A general processor holds its memory apart from its control and arithmetic and moves one word at a time across the gap Backus named the von Neumann bottleneck; a neural processing unit narrows the traffic with a buffer and an array of processing elements but keeps the memory outside; a neuromorphic chip places memory beside each processing element or inside it, so no shared memory sits between a weight and the arithmetic that uses it. The simulated bucket has no panel because a simulator runs the right panel's equations on the left panel's machine, the crossing Figure 4 draws. The event NPU word has no panel either; Figure 22 draws the chip that carries it. Panel layout after the EdgeSNN survey's comparison<d-cite key="deng-2025-edgesnn"></d-cite>, which adapted an earlier figure. Conceptual figure; no measured quantity is drawn.</figcaption>
</figure>
