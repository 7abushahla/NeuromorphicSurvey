        <rect class="f10-band" x="188" y="102" width="930" height="80" fill="#CFE2F3" opacity="0"/><rect x="188" y="102" width="930" height="80" fill="none" stroke="#d5dbe2" stroke-width="1.5"/>
        <text x="28" y="134" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Presynaptic</text><text x="28" y="159" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">spike train</text>

        <line x1="210" y1="286" x2="1115" y2="286" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/>

        <g stroke="#000" stroke-width="1.6" stroke-dasharray="5 5"><line x1="283" y1="162" x2="283" y2="222"/><line x1="370" y1="162" x2="370" y2="217"/><line x1="459" y1="162" x2="459" y2="224"/><line x1="600" y1="162" x2="600" y2="228"/></g><text x="1035" y="237" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#555">event-driven current</text>

      <g class="f10-help">
        <title>The membrane potential integrates synaptic current. In this LIF example, leak pulls the potential downward between inputs, while threshold crossing triggers an output event.</title>
        <rect class="f10-band" x="188" y="335" width="930" height="164" fill="#FFDDA6" opacity="0"/><rect x="188" y="335" width="930" height="164" fill="none" stroke="#d5dbe2" stroke-width="1.5"/>

        <line x1="210" y1="476" x2="1115" y2="476" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/><line x1="210" y1="368" x2="1110" y2="368" stroke="#D63A2F" stroke-width="2.8" stroke-dasharray="9 6"/>

        <text x="1098" y="438" text-anchor="end" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#66717c">reset <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">V</tspan><tspan dy="6" style="font-size:14px">reset</tspan></text>
        <path d="M210 446 C238 446 256 446 283 423 C306 405 336 412 370 426 C396 436 426 434 459 405 C493 376 542 391 600 387 C629 385 656 391 689 403 C721 414 751 406 786 387 C806 376 820 369 836 368 L836 446 C870 445 899 444 936 425 C972 406 1018 415 1100 428" fill="none" stroke="#D63A2F" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="836" y1="368" x2="836" y2="446" stroke="#D63A2F" stroke-width="4.8"/>
        <path d="M507 419 Q541 440 569 414" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/><text x="537" y="460" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">leak</text><path d="M871 397 V365 H839" fill="none" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/><text x="879" y="345" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">threshold crossing</text>
      </g>

      <g class="f10-help">
        <title>At threshold crossing, the LIF neuron emits an output spike and resets. This example includes a refractory interval, but reset and refractoriness are model and platform choices.</title>
        <rect class="f10-band" x="188" y="528" width="930" height="89" fill="#F9D4EA" opacity="0"/><rect x="188" y="528" width="930" height="89" fill="none" stroke="#d5dbe2" stroke-width="1.5"/>
        <text x="28" y="567" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">Output</text><text x="28" y="592" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700" fill="#000">spike</text><text x="142" y="582" style="font-family:'Times New Roman',Times,serif;font-size:23px;font-style:italic" fill="#000">s[t]</text>
        <line x1="210" y1="590" x2="1115" y2="590" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/><path d="M831 590 V542 H841 V590 Z" fill="#D63A2F" stroke="#000" stroke-width="1.4"/><rect x="841" y="548" width="104" height="42" fill="#d5dbe2" opacity="0.75"/>
        <line x1="841" y1="539" x2="945" y2="539" stroke="#000" stroke-width="2"/><line x1="841" y1="533" x2="841" y2="545" stroke="#000" stroke-width="2"/><line x1="945" y1="533" x2="945" y2="545" stroke="#000" stroke-width="2"/><text x="893" y="531" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px" fill="#000">refractory interval</text><text x="893" y="576" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">no new output</text>
      </g>

      <line x1="210" y1="668" x2="1115" y2="668" stroke="#000" stroke-width="2.2" marker-end="url(#f10a)"/><g stroke="#000" stroke-width="1.8"><line x1="283" y1="662" x2="283" y2="674"/><line x1="459" y1="662" x2="459" y2="674"/><line x1="600" y1="662" x2="600" y2="674"/><line x1="836" y1="662" x2="836" y2="674"/><line x1="936" y1="662" x2="936" y2="674"/></g>
      <text x="665" y="709" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px" fill="#000">time <tspan style="font-family:'Times New Roman',Times,serif;font-style:italic">t</tspan></text><text x="280" y="700" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">input</text><text x="836" y="700" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:16px" fill="#555">output</text>
    </svg>
  </div>
  <div class="fig-hint">Hover each signal for the state transition it represents.</div>
  <figcaption><b>Figure 10:</b> A leaky integrate-and-fire neuron maps incoming spike events to a synaptic current, integrates that current into a membrane potential, and emits an output spike when the potential reaches threshold. The reset and refractory interval shown here are explicit model choices, which must remain meaningful across a software and hardware deployment path.</figcaption>
</figure>
