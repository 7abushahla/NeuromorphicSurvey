  <figcaption id="figure-26"><b>Figure 26:</b> A map of spiking inference from application to silicon. Start from what you need to deploy and read down. The figure lists the documented routes that carry it and draws the strongest one, from the sensor that feeds the task to the part it runs on. Selecting anything narrows the question rather than restarting it, so a task, a sensor, a code, a neuron model, a framework, a compiler or a chip keeps only the routes that support it. A chip is either a step on the drawn route, a branch still open, or a setting the route fixes rather than a choice. Three routes terminate in a break, drawn as a red stub, where a documented toolchain edge refuses the computation that reached it. Numbered pins mark the seams of <a class="xref" href="#failed-contract-edges">Section 18.1</a> where they arise between layers, the left rail carries the constraints acting on every layer, and the right rail the challenges that cut across all of them.</figcaption>
